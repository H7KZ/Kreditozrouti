# Local full-stack Compose. `make dev` starts only MySQL and Redis so the apps
# and package watchers can run on the host. `make up` runs the deployable images
# behind Traefik for a production-like local route layout.
#
# Full stack: http://localhost/ -> web, /api -> API, /mcp -> MCP
# Dashboard:  http://localhost:8080/dashboard/

services:
    traefik:
        image: traefik:v3.7.13
        container_name: kreditozrouti-traefik-local
        command:
            - --api.insecure=true
            - --providers.docker=true
            - --providers.docker.exposedbydefault=false
            - --providers.docker.network=kreditozrouti-local
            - --entrypoints.web.address=:80
        ports:
            - '80:80'
            - '127.0.0.1:8080:8080'
        volumes:
            - /var/run/docker.sock:/var/run/docker.sock:ro
        networks:
            - kreditozrouti-local

    mysql:
        image: mysql:26.7.0
        container_name: kreditozrouti-mysql
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            MYSQL_DATABASE: ${MYSQL_DATABASE:-kreditozrouti}
        ports:
            - '43306:3306'
        volumes:
            - ./data/mysql:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-p${MYSQL_ROOT_PASSWORD:-root}']
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped
        networks:
            - kreditozrouti-local

    phpmyadmin:
        image: phpmyadmin:5.2.3
        container_name: kreditozrouti-phpmyadmin
        profiles: ['admin']
        depends_on:
            mysql:
                condition: service_healthy
        environment:
            PMA_HOST: mysql
            PMA_PORT: 3306
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
            UPLOAD_LIMIT: 2G
        ports:
            - '127.0.0.1:48080:80'
        restart: unless-stopped
        networks:
            - kreditozrouti-local

    redis:
        image: redis:8.10.1-alpine
        container_name: kreditozrouti-redis
        command: ['redis-server', '--save', '20', '1', '--appendonly', 'yes', '--loglevel', 'warning']
        ports:
            - '46379:6379'
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 3s
            retries: 20
        restart: unless-stopped
        networks:
            - kreditozrouti-local

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        container_name: kreditozrouti-api
        environment:
            ENV: local
            NODE_ENV: production
            API_PORT: 80
            API_URI: http://localhost/api
            API_DOMAIN: localhost
            API_ALLOWED_ORIGINS: http://localhost
            API_SESSION_SECRET: ${API_SESSION_SECRET:-local}
            API_COMMAND_TOKEN: ${API_COMMAND_TOKEN:-local}
            WEB_URI: http://localhost
            MYSQL_URI: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/${MYSQL_DATABASE:-kreditozrouti}?sslmode=disable&schema=${MYSQL_DATABASE:-kreditozrouti}
            REDIS_URI: redis://redis:6379
            GOOGLE_USER: ${GOOGLE_USER:-}
            GOOGLE_APP_PASSWORD: ${GOOGLE_APP_PASSWORD:-}
        depends_on:
            mysql:
                condition: service_healthy
            redis:
                condition: service_started
        labels:
            - traefik.enable=true
            - traefik.docker.network=kreditozrouti-local
            - traefik.http.routers.kreditozrouti-api.rule=Host(`localhost`) && PathPrefix(`/api`)
            - traefik.http.routers.kreditozrouti-api.priority=100
            - traefik.http.routers.kreditozrouti-api.entrypoints=web
            - traefik.http.services.kreditozrouti-api.loadbalancer.server.port=80
        restart: unless-stopped
        networks:
            - kreditozrouti-local

    scraper:
        build:
            context: .
            dockerfile: apps/scraper/Dockerfile
        container_name: kreditozrouti-scraper
        environment:
            ENV: local
            REDIS_URI: redis://redis:6379
            INSIS_RATE_LIMIT_RPS: ${INSIS_RATE_LIMIT_RPS:-4}
            INSIS_RATE_LIMIT_BURST: ${INSIS_RATE_LIMIT_BURST:-8}
            INSIS_RATE_LIMIT_MAX_WAIT_MS: ${INSIS_RATE_LIMIT_MAX_WAIT_MS:-30000}
        depends_on:
            redis:
                condition: service_started
        restart: unless-stopped
        networks:
            - kreditozrouti-local

    web:
        build:
            context: .
            dockerfile: apps/web/Dockerfile
        container_name: kreditozrouti-web
        environment:
            VITE_API_URL: http://localhost/api
            VITE_FARO_COLLECTOR_URL: ''
            VITE_APP_VERSION: local
            VITE_APP_ENV: local
            VITE_UMAMI_WEBSITE_ID: ''
            VITE_UMAMI_SRC: ''
        depends_on:
            - api
        labels:
            - traefik.enable=true
            - traefik.docker.network=kreditozrouti-local
            - traefik.http.routers.kreditozrouti-web.rule=Host(`localhost`)
            - traefik.http.routers.kreditozrouti-web.priority=1
            - traefik.http.routers.kreditozrouti-web.entrypoints=web
            - traefik.http.services.kreditozrouti-web.loadbalancer.server.port=80
        restart: unless-stopped
        networks:
            - kreditozrouti-local

    mcp:
        build:
            context: .
            dockerfile: apps/mcp/Dockerfile
        container_name: kreditozrouti-mcp
        environment:
            NODE_ENV: production
            MYSQL_URI: mysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/${MYSQL_DATABASE:-kreditozrouti}?sslmode=disable&schema=${MYSQL_DATABASE:-kreditozrouti}
            MCP_PORT: 3000
            MCP_BASE_URL: http://localhost
            MCP_JWT_SECRET: ${MCP_JWT_SECRET:-local}
            MCP_ALLOWED_REDIRECT_HOSTS: ${MCP_ALLOWED_REDIRECT_HOSTS:-claude.ai,claude.com}
        depends_on:
            mysql:
                condition: service_healthy
        labels:
            - traefik.enable=true
            - traefik.docker.network=kreditozrouti-local
            - traefik.http.routers.kreditozrouti-mcp.rule=Host(`localhost`) && PathPrefix(`/mcp`)
            - traefik.http.routers.kreditozrouti-mcp.priority=50
            - traefik.http.routers.kreditozrouti-mcp.entrypoints=web
            - traefik.http.services.kreditozrouti-mcp.loadbalancer.server.port=3000
            - traefik.http.routers.kreditozrouti-mcp-wellknown.rule=Host(`localhost`) && PathPrefix(`/.well-known/oauth`)
            - traefik.http.routers.kreditozrouti-mcp-wellknown.priority=60
            - traefik.http.routers.kreditozrouti-mcp-wellknown.entrypoints=web
            - traefik.http.routers.kreditozrouti-mcp-wellknown.service=kreditozrouti-mcp
        restart: unless-stopped
        networks:
            - kreditozrouti-local

networks:
    kreditozrouti-local:
        name: kreditozrouti-local
        driver: bridge
