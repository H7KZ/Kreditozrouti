services:
  mysql:
    # Pinned to major 9, matching the deployed stacks. `mysql:latest` now resolves to MySQL 26.x
    # (Oracle switched the server to calendar versioning), and MySQL refuses to start against a
    # data directory initialised by a newer major. If ./data/mysql was created by a `latest`
    # that was already 26.x, delete that directory (local data is throwaway) rather than
    # loosening the pin, so local keeps matching production.
    image: mysql:9
    container_name: kreditozrouti-mysql

    volumes:
      - ./data/mysql:/var/lib/mysql

    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=kreditozrouti

    ports:
      - '43306:3306'

    command:
      - --sort_buffer_size=256M
      - --read_buffer_size=128M
      - --read_rnd_buffer_size=128M
      - --join_buffer_size=128M
      - --max_sort_length=8192
      - --innodb_sort_buffer_size=64M

    deploy:
      mode: global

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: stop-first

      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: stop-first

      resources:
        limits:
          cpus: 2
          memory: 8192M

    restart: unless-stopped

  # ================================================================ #

  phpmyadmin:
    # Pinned so a local session cannot differ from the deployed stacks over an image bump.
    image: phpmyadmin:5.2.3-apache
    container_name: kreditozrouti-phpmyadmin

    # PMA_ARBITRARY is deliberately absent. With it enabled this page accepts an arbitrary
    # host, which turns the container into an open MySQL client against any server a visitor
    # names. That is unacceptable even locally, because the publish below would otherwise
    # expose it to every machine on whatever network the laptop is joined to.
    environment:
      - PMA_HOST=kreditozrouti-mysql
      - PMA_PORT=3306
      - PMA_USER=root
      - PMA_PASSWORD=root
      - UPLOAD_LIMIT=2G

    # Loopback only. A bare '48080:80' binds 0.0.0.0, publishing a root-credentialled database
    # UI to the local network. Mirrors the deployed stacks, which are also loopback-only.
    ports:
      - '127.0.0.1:48080:80'

    deploy:
      mode: global

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: stop-first

      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: stop-first

      resources:
        limits:
          cpus: 1
          memory: 2048M

    restart: unless-stopped

  # ================================================================ #

  redis:
    # Pinned to major 8, matching the deployed stacks.
    image: redis:8-alpine
    container_name: kreditozrouti-redis

    command: [ '--save', '20', '1', '--loglevel', 'warning' ]

    ports:
      - '46379:6379'

    deploy:
      mode: global

      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

      rollback_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: stop-first

      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        monitor: 60s
        max_failure_ratio: 0.3
        order: stop-first

      resources:
        limits:
          cpus: 2
          memory: 4096M

    restart: unless-stopped

  # ================================================================ #

  prometheus:
    image: prom/prometheus:v3
    container_name: kreditozrouti-prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'

    volumes:
      - ./deployment/monitoring/prometheus/prometheus.local.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - '49090:9090'

    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: 0.5
          memory: 512M

    restart: unless-stopped

  # ================================================================ #

  grafana:
    image: grafana/grafana:13.2
    container_name: kreditozrouti-grafana

    environment:
      - GF_SERVER_ROOT_URL=http://localhost:43000
      - GF_SECURITY_ADMIN_USER=root
      - GF_SECURITY_ADMIN_PASSWORD=root
      - GF_USERS_ALLOW_SIGN_UP=false
      - DISCORD_WEBHOOK_URL=-

    volumes:
      - ./deployment/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    ports:
      - '43000:3000'

    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: 0.5
          memory: 512M

    restart: unless-stopped

  # ================================================================ #

  loki:
    image: grafana/loki:3.7
    container_name: kreditozrouti-loki

    command: -config.file=/etc/loki/loki.yml

    volumes:
      - ./deployment/monitoring/loki/loki.yml:/etc/loki/loki.yml:ro

    ports:
      - '43100:3100'

    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: 0.5
          memory: 512M

    restart: unless-stopped

  # ================================================================ #

  alloy:
    image: grafana/alloy:v1.19.2
    container_name: kreditozrouti-alloy

    environment:
      - FARO_ALLOWED_ORIGIN=http://localhost:45173

    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./deployment/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro

    ports:
      - '41247:12347'

    deploy:
      mode: global
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      resources:
        limits:
          cpus: 0.5
          memory: 512M

    restart: unless-stopped
