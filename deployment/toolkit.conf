# Toolkit integration. Format and keys: https://github.com/H7KZ/Toolkit/tree/main/docs/consumers.md
REPOSITORY=kreditozrouti

# <environment>:<snapshot root below the deploy user's home>
# `ingress` (lock environment `infrastructure`, the only one toolkit 0.11 accepts for it) is this repository's own Traefik (deployment/ingress, compose project `global`). Deploy it
# only on a server without Infrastructure's Traefik (standalone mode); apps need `public-network` first.
# `monitoring` is this repository's own observability + analytics stack (deployment/monitoring: Grafana, Prometheus,
# Loki, Alloy, Alertmanager, Umami); it is not shared with the other repositories on the host.
RELEASE_TARGETS=production:kreditozrouti/versions/production development:kreditozrouti/versions/development monitoring:kreditozrouti/versions/monitoring infrastructure:kreditozrouti/versions/ingress

# Backups: every component every 4 h (UTC, :35 keeps clear of Infrastructure :55, Ohlidame :15, PortfolioV7 :45).
# Host Sync enables the timer after one successful run; settings come from GitHub secrets.
BACKUP_COMPONENTS=deployment/backup/components.sh
BACKUP_AT=*-*-* 00/4:35:00 UTC

# Scheduled jobs. The Umami retention purge runs under the monitoring lock environment.
JOBS=umami-retention
JOB_UMAMI_RETENTION_RUN=deployment/monitoring/umami/retain.sh
JOB_UMAMI_RETENTION_AT=*-*-* 03:17:00 Europe/Prague
JOB_UMAMI_RETENTION_ENVIRONMENT=monitoring

# Host-wide singletons: declared in exactly ONE repository per host. Infrastructure carries them on the
# shared server. Enable these lines only when this repository runs its own ingress on a dedicated
# server (standalone mode), then rerun `sudo deployment/toolkit install --deploy-user deploy`
# (docs/runbooks/split-to-own-server.md).
# Weekly host package updates:
# MAINTENANCE_AT=Sun *-*-* 03:30:00 UTC
# Cloudflare-only origin firewall, re-applied at boot before containers are reconciled:
# RECONCILE_BEFORE=deployment/ingress/cloudflare-firewall.sh
# ...and refreshed weekly (also change JOBS above to: JOBS=umami-retention cloudflare-firewall):
# JOB_CLOUDFLARE_FIREWALL_RUN=deployment/ingress/cloudflare-firewall.sh
# JOB_CLOUDFLARE_FIREWALL_AT=Mon *-*-* 04:00:00 UTC
# JOB_CLOUDFLARE_FIREWALL_ENVIRONMENT=infrastructure
# JOB_CLOUDFLARE_FIREWALL_HOST_WINDOW=true
