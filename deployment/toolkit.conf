# Toolkit integration. Format and keys: https://github.com/H7KZ/Toolkit/tree/main/docs/consumers.md
REPOSITORY=kreditozrouti

# <environment>:<snapshot root below the deploy user's home>
RELEASE_TARGETS=production:kreditozrouti/versions/production development:kreditozrouti/versions/development monitoring:kreditozrouti/versions/monitoring

# Backups: component list and schedules (UTC, :35 keeps clear of Infrastructure :55, Ohlidame :15, PortfolioV7 :45)
BACKUP_COMPONENTS=deployment/backup/components.sh
BACKUP_4H_AT=*-*-* 00,04,08,12,16,20:35:00 UTC
BACKUP_DAILY_AT=*-*-* 01:35:00 UTC

# Scheduled jobs
JOBS=umami-retention
JOB_UMAMI_RETENTION_RUN=deployment/monitoring/umami/retain.sh
JOB_UMAMI_RETENTION_AT=*-*-* 03:17:00 UTC
JOB_UMAMI_RETENTION_ENVIRONMENT=monitoring
