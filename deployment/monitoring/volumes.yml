# ==============================================================================
# Volumes Configuration: Monitoring Stack
# Description: Persistent volumes for the monitoring services.
#   Naming: <project>-<component>-volume. traefik-logs-volume is owned by the
#   Infrastructure Traefik stack (shared, read-only) — not renamed here.
# ==============================================================================

volumes:
  kreditozrouti-prometheus-volume:
    name: kreditozrouti-prometheus-volume
    external: true

  kreditozrouti-grafana-volume:
    name: kreditozrouti-grafana-volume
    external: true

  kreditozrouti-loki-volume:
    name: kreditozrouti-loki-volume
    external: true

  kreditozrouti-alloy-volume:
    name: kreditozrouti-alloy-volume
    external: true

  kreditozrouti-umami-postgres-volume:
    name: kreditozrouti-umami-postgres-volume
    external: true

  # Owned by Infrastructure's Traefik stack (shared, read-only input to Alloy).
  traefik-logs-volume:
    name: traefik-logs-volume
    external: true
