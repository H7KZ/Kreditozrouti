# ==============================================================================
# Docker Compose: Monitoring Stack
# Description: Prometheus metrics + Grafana Loki logs + Grafana visualization.
#
# Services:
#   - prometheus: Scrapes /metrics from the API; stores time series data
#   - grafana:    Visualization dashboard, exposed at domain/grafana via Traefik
#   - loki:       Log aggregation storage (7-day retention)
#   - alloy:      Log shipping agent — reads Docker stdout, receives Faro browser telemetry
#
# Required Environment Variables (in .env):
#   - DOMAIN: Primary domain for Traefik routing (e.g. kreditozrouti.cz)
#   - PROJECT: Project name prefix for Traefik labels (e.g. kreditozrouti)
#   - GRAFANA_ADMIN_USER: Grafana admin username
#   - GRAFANA_ADMIN_PASSWORD: Grafana admin password
#   - UMAMI_DB_NAME        — PostgreSQL database name for Umami (e.g. umami)
#   - UMAMI_DB_USER        — PostgreSQL user for Umami (e.g. umami)
#   - UMAMI_DB_PASSWORD    — PostgreSQL password (generate once, store in GitHub Secrets)
#   - UMAMI_APP_SECRET     — Umami app secret for session signing (generate once, store in GitHub Secrets)
#   - FARO_ALLOWED_ORIGIN  — Allowed CORS origin for Faro receiver (e.g. https://kreditozrouti.cz)
#
# Image pinning policy: every image here is pinned to a major (or major.minor) tag,
# never :latest. Every deploy runs `docker compose pull`, so :latest silently rolls a
# stateful service (Grafana's SQLite, Loki's index, Postgres' data dir) across a major
# version on a routine deploy - and those migrations are one-way. A pinned tag still
# receives patch fixes; the upgrade decision stays a commit.
#
# Deploy order: Traefik → this stack → app stack
# Usage: docker compose -f docker-compose.monitoring.yml -f networks.yml -f volumes.yml up -d
# ==============================================================================

services:
  # ============================================================================
  # Metrics Collector (Prometheus)
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3
    restart: unless-stopped
    # Grants the 'nobody' process read access to the mounted docker.sock so Docker-SD
    # can list containers. Must equal the host's docker group GID (getent group docker).
    # Default 988 matches the current host; override with DOCKER_GID in .env if it differs.
    # A wrong GID silently yields zero scrape targets (blank dashboards + Container Down).
    group_add:
      - "${DOCKER_GID:-988}"

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
      # Opens /api/v1/write so Alloy can PUSH the MySQL backup health gauges. The
      # backup is a host systemd timer, not a container, so the Docker-SD pull job
      # cannot reach it. See docs/adr/0001-backup-health-via-alloy-textfile.md.
      - '--web.enable-remote-write-receiver'

    volumes:
      - kreditozrouti-prometheus-volume:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

    networks:
      - kreditozrouti-monitoring-internal-network
      - kreditozrouti-monitoring-network

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ============================================================================
  # Visualization (Grafana)
  # ============================================================================
  grafana:
    image: grafana/grafana:13.2
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_SERVER_ROOT_URL=https://${DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}

    volumes:
      - kreditozrouti-grafana-volume:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    networks:
      - public-network
      - kreditozrouti-monitoring-internal-network

    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT}-grafana.priority=70'
      - 'traefik.http.routers.${PROJECT}-grafana.rule=Host(`${DOMAIN}`) && PathPrefix(`/grafana`)'
      - 'traefik.http.routers.${PROJECT}-grafana.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT}-grafana.tls=true'
      - 'traefik.http.routers.${PROJECT}-grafana.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.${PROJECT}-grafana.loadbalancer.server.port=3000'

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M


  # ============================================================================
  # Log Storage (Loki)
  # Internal only — no Traefik labels. Grafana accesses it at http://loki:3100.
  # ============================================================================
  loki:
    image: grafana/loki:3.7
    restart: unless-stopped

    command: -config.file=/etc/loki/loki.yml

    volumes:
      - kreditozrouti-loki-volume:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro

    networks:
      - kreditozrouti-monitoring-internal-network

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # Log Shipping Agent (Alloy)
  # Reads Docker container stdout via Docker socket → Loki.
  # Also receives Grafana Faro browser telemetry on port 12347 (added in Plan 2).
  # ============================================================================
  alloy:
    image: grafana/alloy:v1.19.2 # no floating v1 tag is published, so the exact version is pinned
    restart: unless-stopped

    # Same docker.sock group access as Prometheus - Alloy's discovery.docker reads the
    # socket to tail container stdout. Without the right GID, no container logs reach Loki.
    group_add:
      - "${DOCKER_GID:-988}"

    environment:
      - FARO_ALLOWED_ORIGIN=${FARO_ALLOWED_ORIGIN:-*}

    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - kreditozrouti-alloy-volume:/var/lib/alloy/data
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - traefik-logs-volume:/var/log/traefik:ro
      # Host textfile-collector directory. scripts/backup-mysql.sh writes
      # mysql-backup.prom here after every run; Alloy's prometheus.exporter.unix
      # reads it and remote-writes the gauges to Prometheus. Read-only: Alloy must
      # never be able to forge or clear backup evidence.
      - /var/lib/kreditozrouti/textfile-collector:/var/lib/textfile-collector:ro

    networks:
      - kreditozrouti-monitoring-internal-network
      - public-network
      - kreditozrouti-monitoring-network

    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT}-faro.priority=80'
      - 'traefik.http.routers.${PROJECT}-faro.rule=PathPrefix(`/faro`)'
      - 'traefik.http.routers.${PROJECT}-faro.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT}-faro.tls=true'
      - 'traefik.http.routers.${PROJECT}-faro.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.middlewares.${PROJECT}-faro-strip.stripprefix.prefixes=/faro'
      - 'traefik.http.routers.${PROJECT}-faro.middlewares=${PROJECT}-faro-strip'
      - 'traefik.http.services.${PROJECT}-faro.loadbalancer.server.port=12347'

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M


  # ============================================================================
  # Umami Analytics Database (PostgreSQL 16-alpine)
  # Internal only — no Traefik labels. Umami connects at umami-db:5432.
  # ============================================================================
  umami-db:
    image: postgres:16-alpine
    restart: unless-stopped

    environment:
      - POSTGRES_DB=${UMAMI_DB_NAME}
      - POSTGRES_USER=${UMAMI_DB_USER}
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}

    volumes:
      - kreditozrouti-umami-postgres-volume:/var/lib/postgresql/data

    networks:
      - kreditozrouti-monitoring-internal-network

    healthcheck:
      test: [ 'CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ============================================================================
  # Umami Analytics (Product analytics, UTM attribution, conversion funnel)
  # Exposed at umami.DOMAIN via Traefik. Connects to PostgreSQL at umami-db:5432.
  # ============================================================================
  umami:
    # The postgresql-* build, not the mysql one: umami-db above is postgres:16-alpine.
    # :latest was also ambiguous about which database variant it resolved to.
    image: ghcr.io/umami-software/umami:postgresql-v2.16
    restart: unless-stopped

    depends_on:
      umami-db:
        condition: service_healthy

    environment:
      - DATABASE_URL=postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@umami-db:5432/${UMAMI_DB_NAME}
      - APP_SECRET=${UMAMI_APP_SECRET}

    networks:
      - kreditozrouti-monitoring-internal-network
      - public-network

    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT}-umami.rule=Host(`umami.${DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT}-umami.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT}-umami.tls=true'
      - 'traefik.http.routers.${PROJECT}-umami.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.${PROJECT}-umami.loadbalancer.server.port=3000'

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
