# Deploy with deploy.sh (it writes .secrets/ and passes the env vars below).
# Env: GRAFANA_ADMIN_USER GRAFANA_ADMIN_PASSWORD UMAMI_DB_NAME UMAMI_DB_USER UMAMI_DB_PASSWORD UMAMI_APP_SECRET UMAMI_GRAFANA_PASSWORD DOCKER_GID
name: kreditozrouti-monitoring
services:
  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
      - --web.enable-remote-write-receiver
      - --web.enable-lifecycle
    dns_search: []
    volumes:
      - kreditozrouti-prometheus-volume:/prometheus
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
    networks:
      - kreditozrouti-monitoring-internal-network
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:9090/-/ready
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpu_shares: 256
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
  alertmanager:
    image: prom/alertmanager:v0.34.0
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://kreditozrouti.cz/grafana
      - --web.route-prefix=/
    volumes:
      - kreditozrouti-alertmanager-volume:/alertmanager
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - ./.secrets:/etc/alertmanager/secrets:ro
    networks:
      - kreditozrouti-monitoring-internal-network
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:9093/-/ready
      interval: 60s
      timeout: 5s
      retries: 5
      start_interval: 3s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpu_shares: 256
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
  loki:
    image: grafana/loki:3.7.7
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    environment:
      - GOMEMLIMIT=256MiB
    volumes:
      - kreditozrouti-loki-volume:/loki
      - ./loki/loki.yml:/etc/loki/loki.yml:ro
      - ./loki/runtime.yml:/etc/loki/runtime.yml:ro
      - ./loki/rules:/etc/loki/rules:ro
    networks:
      - kreditozrouti-monitoring-internal-network
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpu_shares: 256
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
  alloy:
    image: grafana/alloy:v1.19.2
    restart: unless-stopped
    group_add:
      - ${DOCKER_GID:-988}
    environment:
      - GOMEMLIMIT=270MiB
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --disable-reporting
      - /etc/alloy/config.alloy
    volumes:
      - kreditozrouti-alloy-volume:/var/lib/alloy/data
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /proc:/host/proc:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /:/host/root:ro
      - traefik-logs-volume:/var/log/traefik:ro
    networks:
      - kreditozrouti-monitoring-internal-network
      - kreditozrouti-monitoring-network
      - public-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=public-network
      - traefik.http.routers.kreditozrouti-faro-production.rule=Host(`kreditozrouti.cz`) && PathPrefix(`/faro`)
      - traefik.http.routers.kreditozrouti-faro-production.priority=210
      - traefik.http.routers.kreditozrouti-faro-production.entrypoints=websecure
      - traefik.http.routers.kreditozrouti-faro-production.tls=true
      - traefik.http.routers.kreditozrouti-faro-production.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.kreditozrouti-faro-production.service=kreditozrouti-faro-production
      - traefik.http.services.kreditozrouti-faro-production.loadbalancer.server.port=12347
      - traefik.http.middlewares.kreditozrouti-faro-production-strip.stripprefix.prefixes=/faro
      - traefik.http.routers.kreditozrouti-faro-production.middlewares=kreditozrouti-faro-production-strip
      - traefik.http.routers.kreditozrouti-faro-development.rule=Host(`dev.kreditozrouti.cz`) && PathPrefix(`/faro`)
      - traefik.http.routers.kreditozrouti-faro-development.priority=210
      - traefik.http.routers.kreditozrouti-faro-development.entrypoints=websecure
      - traefik.http.routers.kreditozrouti-faro-development.tls=true
      - traefik.http.routers.kreditozrouti-faro-development.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.kreditozrouti-faro-development.service=kreditozrouti-faro-development
      - traefik.http.services.kreditozrouti-faro-development.loadbalancer.server.port=12347
      - traefik.http.middlewares.kreditozrouti-faro-development-strip.stripprefix.prefixes=/faro
      - traefik.http.routers.kreditozrouti-faro-development.middlewares=kreditozrouti-faro-development-strip
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpu_shares: 256
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 320M
  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_SERVER_ROOT_URL=https://kreditozrouti.cz/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_DISABLE_PLUGINS=grafana-pyroscope-app,grafana-exploretraces-app
      - GF_METRICS_ENABLED=true
      - GOMEMLIMIT=307MiB
      - UMAMI_DB_NAME=${UMAMI_DB_NAME}
      - UMAMI_GRAFANA_PASSWORD=${UMAMI_GRAFANA_PASSWORD}
    volumes:
      - kreditozrouti-grafana-volume:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - public-network
      - kreditozrouti-monitoring-internal-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=public-network
      - traefik.http.routers.kreditozrouti-grafana.rule=Host(`kreditozrouti.cz`) && PathPrefix(`/grafana`)
      - traefik.http.routers.kreditozrouti-grafana.priority=200
      - traefik.http.routers.kreditozrouti-grafana.entrypoints=websecure
      - traefik.http.routers.kreditozrouti-grafana.tls=true
      - traefik.http.routers.kreditozrouti-grafana.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.kreditozrouti-grafana.service=kreditozrouti-grafana
      - traefik.http.services.kreditozrouti-grafana.loadbalancer.server.port=3000
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://localhost:3000/api/health
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 60s
      start_interval: 3s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpu_shares: 256
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
  umami-db:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${UMAMI_DB_NAME}
      - POSTGRES_USER=${UMAMI_DB_USER}
      - POSTGRES_PASSWORD=${UMAMI_DB_PASSWORD}
    volumes:
      - kreditozrouti-umami-postgres-volume:/var/lib/postgresql
    networks:
      - kreditozrouti-monitoring-internal-network
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 30s
      start_interval: 3s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpu_shares: 256
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 192M
  umami:
    image: ghcr.io/umami-software/umami:3.3.1
    restart: unless-stopped
    depends_on:
      umami-db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${UMAMI_DB_USER}:${UMAMI_DB_PASSWORD}@umami-db:5432/${UMAMI_DB_NAME}
      - APP_SECRET=${UMAMI_APP_SECRET}
      - TRACKER_SCRIPT_NAME=stats.js
      - DISABLE_TELEMETRY=1
      - CLIENT_IP_HEADER=cf-connecting-ip
    networks:
      - kreditozrouti-monitoring-internal-network
      - public-network
    labels:
      - traefik.enable=true
      - traefik.docker.network=public-network
      - traefik.http.routers.kreditozrouti-umami.rule=Host(`umami.kreditozrouti.cz`)
      - traefik.http.routers.kreditozrouti-umami.priority=200
      - traefik.http.routers.kreditozrouti-umami.entrypoints=websecure
      - traefik.http.routers.kreditozrouti-umami.tls=true
      - traefik.http.routers.kreditozrouti-umami.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.kreditozrouti-umami.service=kreditozrouti-umami
      - traefik.http.services.kreditozrouti-umami.loadbalancer.server.port=3000
      - traefik.http.routers.kreditozrouti-stats-production.rule=Host(`kreditozrouti.cz`) && PathPrefix(`/stats`)
      - traefik.http.routers.kreditozrouti-stats-production.priority=210
      - traefik.http.routers.kreditozrouti-stats-production.entrypoints=websecure
      - traefik.http.routers.kreditozrouti-stats-production.tls=true
      - traefik.http.routers.kreditozrouti-stats-production.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.kreditozrouti-stats-production.service=kreditozrouti-stats-production
      - traefik.http.services.kreditozrouti-stats-production.loadbalancer.server.port=3000
      - traefik.http.middlewares.kreditozrouti-stats-production-strip.stripprefix.prefixes=/stats
      - traefik.http.routers.kreditozrouti-stats-production.middlewares=kreditozrouti-stats-production-strip
      - traefik.http.routers.kreditozrouti-stats-development.rule=Host(`dev.kreditozrouti.cz`) && PathPrefix(`/stats`)
      - traefik.http.routers.kreditozrouti-stats-development.priority=210
      - traefik.http.routers.kreditozrouti-stats-development.entrypoints=websecure
      - traefik.http.routers.kreditozrouti-stats-development.tls=true
      - traefik.http.routers.kreditozrouti-stats-development.tls.certresolver=letsencrypt-dns
      - traefik.http.routers.kreditozrouti-stats-development.service=kreditozrouti-stats-development
      - traefik.http.services.kreditozrouti-stats-development.loadbalancer.server.port=3000
      - traefik.http.middlewares.kreditozrouti-stats-development-strip.stripprefix.prefixes=/stats
      - traefik.http.routers.kreditozrouti-stats-development.middlewares=kreditozrouti-stats-development-strip
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    cpu_shares: 256
    oom_score_adj: 500
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
