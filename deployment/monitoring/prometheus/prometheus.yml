global:
  scrape_interval: 60s
  scrape_timeout: 10s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
scrape_configs:
  - job_name: kreditozrouti/prometheus
    static_configs:
      - targets:
          - localhost:9090
        labels:
          project: kreditozrouti
          service: prometheus
          env: ops
          instance: prometheus
  - job_name: kreditozrouti/alertmanager
    static_configs:
      - targets:
          - alertmanager:9093
        labels:
          project: kreditozrouti
          service: alertmanager
          env: ops
          instance: alertmanager
  - job_name: kreditozrouti/loki
    static_configs:
      - targets:
          - loki:3100
        labels:
          project: kreditozrouti
          service: loki
          env: ops
          instance: loki
  - job_name: kreditozrouti/alloy
    honor_labels: true
    static_configs:
      - targets:
          - alloy:12345
        labels:
          project: kreditozrouti
          service: alloy
          env: ops
          instance: alloy
  - job_name: kreditozrouti/grafana
    metrics_path: /grafana/metrics
    static_configs:
      - targets:
          - grafana:3000
        labels:
          project: kreditozrouti
          service: grafana
          env: ops
          instance: grafana
