rule_files:
  - ../rules/recording.yml
  - ../rules/alerts.yml
evaluation_interval: 30s
tests:
  - name: "ServiceDown: api healthy"
    interval: 1m
    input_series:
      - series: up{project="kreditozrouti", service="scraper", env="production", job="kreditozrouti/scraper", instance="kreditozrouti-scraper-1"}
        values: 1x500
      - series: up{project="kreditozrouti", service="api", env="production", job="kreditozrouti/api", instance="kreditozrouti-api-1"}
        values: 1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []
  - name: "ServiceDown: api failing scrape"
    interval: 1m
    input_series:
      - series: up{project="kreditozrouti", service="scraper", env="production", job="kreditozrouti/scraper", instance="kreditozrouti-scraper-1"}
        values: 1x500
      - series: up{project="kreditozrouti", service="api", env="production", job="kreditozrouti/api", instance="kreditozrouti-api-1"}
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: api
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti api is down
              description: No production api container has been scrapeable for 5 minutes (stopped, crash-looping, or its /metrics endpoint is failing).
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "ServiceDown: api container gone"
    interval: 1m
    input_series:
      - series: up{project="kreditozrouti", service="scraper", env="production", job="kreditozrouti/scraper", instance="kreditozrouti-scraper-1"}
        values: 1x500
      - series: up{project="kreditozrouti", service="api", env="development", job="kreditozrouti/api", instance="kreditozrouti-dev-api-1"}
        values: 1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: api
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti api is down
              description: No production api container has been scrapeable for 5 minutes (stopped, crash-looping, or its /metrics endpoint is failing).
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "ServiceDown: scraper healthy"
    interval: 1m
    input_series:
      - series: up{project="kreditozrouti", service="api", env="production", job="kreditozrouti/api", instance="kreditozrouti-api-1"}
        values: 1x500
      - series: up{project="kreditozrouti", service="scraper", env="production", job="kreditozrouti/scraper", instance="kreditozrouti-scraper-1"}
        values: 1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts: []
  - name: "ServiceDown: scraper failing scrape"
    interval: 1m
    input_series:
      - series: up{project="kreditozrouti", service="api", env="production", job="kreditozrouti/api", instance="kreditozrouti-api-1"}
        values: 1x500
      - series: up{project="kreditozrouti", service="scraper", env="production", job="kreditozrouti/scraper", instance="kreditozrouti-scraper-1"}
        values: "0x20"
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: scraper
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti scraper is down
              description: No production scraper container has been scrapeable for 5 minutes (stopped, crash-looping, or its /metrics endpoint is failing).
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "ServiceDown: scraper container gone"
    interval: 1m
    input_series:
      - series: up{project="kreditozrouti", service="api", env="production", job="kreditozrouti/api", instance="kreditozrouti-api-1"}
        values: 1x500
      - series: up{project="kreditozrouti", service="scraper", env="development", job="kreditozrouti/scraper", instance="kreditozrouti-dev-scraper-1"}
        values: 1x20
    alert_rule_test:
      - eval_time: 15m
        alertname: ServiceDown
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: scraper
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti scraper is down
              description: No production scraper container has been scrapeable for 5 minutes (stopped, crash-looping, or its /metrics endpoint is failing).
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "OriginProbeFailing: api probe ok"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="client", env="production", job="kreditozrouti/probe"}
        values: 1x500
      - series: probe_success{project="kreditozrouti", service="api", env="production", job="kreditozrouti/probe"}
        values: 1x10
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts: []
  - name: "OriginProbeFailing: api probe failing"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="client", env="production", job="kreditozrouti/probe"}
        values: 1x500
      - series: probe_success{project="kreditozrouti", service="api", env="production", job="kreditozrouti/probe"}
        values: "0x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: api
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti api is not serving through Traefik
              description: The internal probe of https://kreditozrouti.cz/api/health via Traefik has failed for 3 minutes. Cloudflare edge outages are not visible here.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "OriginProbeFailing: client probe ok"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="api", env="production", job="kreditozrouti/probe"}
        values: 1x500
      - series: probe_success{project="kreditozrouti", service="client", env="production", job="kreditozrouti/probe"}
        values: 1x10
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts: []
  - name: "OriginProbeFailing: client probe failing"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="api", env="production", job="kreditozrouti/probe"}
        values: 1x500
      - series: probe_success{project="kreditozrouti", service="client", env="production", job="kreditozrouti/probe"}
        values: "0x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: client
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti client is not serving through Traefik
              description: The internal probe of https://kreditozrouti.cz/ via Traefik has failed for 3 minutes. Cloudflare edge outages are not visible here.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "OriginProbeFailing: mcp probe ok"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="api", env="production", job="kreditozrouti/probe"}
        values: 1x500
      - series: probe_success{project="kreditozrouti", service="mcp", env="production", job="kreditozrouti/probe"}
        values: 1x10
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts: []
  - name: "OriginProbeFailing: mcp probe failing"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="api", env="production", job="kreditozrouti/probe"}
        values: 1x500
      - series: probe_success{project="kreditozrouti", service="mcp", env="production", job="kreditozrouti/probe"}
        values: "0x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: mcp
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti mcp is not serving through Traefik
              description: The internal probe of https://kreditozrouti.cz/mcp/health via Traefik has failed for 3 minutes. Cloudflare edge outages are not visible here.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-service-mcp
  - name: "OriginProbeFailing: umami probe ok"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="umami", env="ops", job="kreditozrouti/probe"}
        values: 1x10
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts: []
  - name: "OriginProbeFailing: umami probe failing"
    interval: 1m
    input_series:
      - series: probe_success{project="kreditozrouti", service="umami", env="ops", job="kreditozrouti/probe"}
        values: "0x10"
    alert_rule_test:
      - eval_time: 8m
        alertname: OriginProbeFailing
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: umami
              env: ops
              severity: warning
            exp_annotations:
              summary: Kreditozrouti umami is not serving through Traefik
              description: The internal probe of https://umami.kreditozrouti.cz/ via Traefik has failed for 3 minutes. Cloudflare edge outages are not visible here.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-frontend
  - name: "EdgeErrorBudgetBurnFast: healthy traffic"
    interval: 1m
    input_series:
      - series: traefik_router_requests_total{project="kreditozrouti", service="api", env="production", code="200", method="GET", protocol="http", router="kreditozrouti-api-kreditozrouti@docker"}
        values: 0+60x420
    alert_rule_test:
      - eval_time: 90m
        alertname: EdgeErrorBudgetBurnFast
        exp_alerts: []
  - name: "EdgeErrorBudgetBurnFast: half the requests fail"
    interval: 1m
    input_series:
      - series: traefik_router_requests_total{project="kreditozrouti", service="api", env="production", code="200", method="GET", protocol="http", router="kreditozrouti-api-kreditozrouti@docker"}
        values: 0+30x420
      - series: traefik_router_requests_total{project="kreditozrouti", service="api", env="production", code="502", method="GET", protocol="http", router="kreditozrouti-api-kreditozrouti@docker"}
        values: 0+30x420
    alert_rule_test:
      - eval_time: 90m
        alertname: EdgeErrorBudgetBurnFast
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: api
              env: production
              severity: critical
            exp_annotations:
              summary: Kreditozrouti api is burning its error budget fast
              description: More than 14.4% of requests through Traefik failed with 5xx over both the last hour and the last 5 minutes. At this rate the monthly 99% budget is gone in about two days.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "EdgeErrorBudgetBurnFast: too little traffic to judge"
    interval: 1m
    input_series:
      - series: traefik_router_requests_total{project="kreditozrouti", service="api", env="production", code="502", method="GET", protocol="http", router="kreditozrouti-api-kreditozrouti@docker"}
        values: 0+0.1x420
    alert_rule_test:
      - eval_time: 90m
        alertname: EdgeErrorBudgetBurnFast
        exp_alerts: []
  - name: "EdgeErrorBudgetBurnSlow: healthy traffic"
    interval: 1m
    input_series:
      - series: traefik_router_requests_total{project="kreditozrouti", service="api", env="production", code="200", method="GET", protocol="http", router="kreditozrouti-api-kreditozrouti@docker"}
        values: 0+60x420
    alert_rule_test:
      - eval_time: 400m
        alertname: EdgeErrorBudgetBurnSlow
        exp_alerts: []
  - name: "EdgeErrorBudgetBurnSlow: ten percent fail"
    interval: 1m
    input_series:
      - series: traefik_router_requests_total{project="kreditozrouti", service="api", env="production", code="200", method="GET", protocol="http", router="kreditozrouti-api-kreditozrouti@docker"}
        values: 0+54x420
      - series: traefik_router_requests_total{project="kreditozrouti", service="api", env="production", code="500", method="GET", protocol="http", router="kreditozrouti-api-kreditozrouti@docker"}
        values: 0+6x420
    alert_rule_test:
      - eval_time: 400m
        alertname: EdgeErrorBudgetBurnSlow
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: api
              env: production
              severity: warning
            exp_annotations:
              summary: Kreditozrouti api is steadily burning its error budget
              description: More than 6% of requests through Traefik failed with 5xx over the last 6 hours and 30 minutes.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-overview
  - name: "ApiSlowRequests: fast"
    interval: 1m
    input_series:
      - series: http_server_request_duration_seconds_bucket{project="kreditozrouti", service="api", env="production", method="GET", route="/x", status_code="200", le="1"}
        values: 0+60x40
      - series: http_server_request_duration_seconds_count{project="kreditozrouti", service="api", env="production", method="GET", route="/x", status_code="200"}
        values: 0+60x40
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiSlowRequests
        exp_alerts: []
  - name: "ApiSlowRequests: slow"
    interval: 1m
    input_series:
      - series: http_server_request_duration_seconds_bucket{project="kreditozrouti", service="api", env="production", method="GET", route="/x", status_code="200", le="1"}
        values: 0+30x40
      - series: http_server_request_duration_seconds_count{project="kreditozrouti", service="api", env="production", method="GET", route="/x", status_code="200"}
        values: 0+60x40
    alert_rule_test:
      - eval_time: 30m
        alertname: ApiSlowRequests
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              service: api
              env: production
              severity: warning
            exp_annotations:
              summary: Kreditozrouti api is slow
              description: More than 5% of api requests took longer than 1 s over 10 minutes.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-service-api
  - name: "WorkerJobsFailing: old failures only"
    interval: 1m
    input_series:
      - series: worker_jobs_total{project="kreditozrouti", service="api", env="production", queue="ScraperResponseQueue", job_name="job", outcome="failure", instance="kreditozrouti-api-1"}
        values: 5x40
      - series: worker_jobs_total{project="kreditozrouti", service="api", env="production", queue="ScraperResponseQueue", job_name="job", outcome="success", instance="kreditozrouti-api-1"}
        values: 0+1x40
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkerJobsFailing
        exp_alerts: []
  - name: "WorkerJobsFailing: new failures"
    interval: 1m
    input_series:
      - series: worker_jobs_total{project="kreditozrouti", service="api", env="production", queue="ScraperResponseQueue", job_name="job", outcome="failure", instance="kreditozrouti-api-1"}
        values: 0+1x40
    alert_rule_test:
      - eval_time: 30m
        alertname: WorkerJobsFailing
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              env: production
              queue: ScraperResponseQueue
              service: api
              severity: warning
            exp_annotations:
              summary: Kreditozrouti ScraperResponseQueue jobs are failing
              description: More than 3 ScraperResponseQueue jobs failed in the last 15 minutes.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-service-api
  - name: "QueueBacklog: short spike"
    interval: 1m
    input_series:
      - series: bullmq_job_count{project="kreditozrouti", service="api", env="production", queue="ScraperResponseQueue", state="waiting", instance="kreditozrouti-api-1"}
        values: 100x5 0x30
    alert_rule_test:
      - eval_time: 30m
        alertname: QueueBacklog
        exp_alerts: []
  - name: "QueueBacklog: sustained backlog"
    interval: 1m
    input_series:
      - series: bullmq_job_count{project="kreditozrouti", service="api", env="production", queue="ScraperResponseQueue", state="waiting", instance="kreditozrouti-api-1"}
        values: 100x40
    alert_rule_test:
      - eval_time: 30m
        alertname: QueueBacklog
        exp_alerts:
          - exp_labels:
              project: kreditozrouti
              env: production
              queue: ScraperResponseQueue
              service: api
              severity: warning
            exp_annotations:
              summary: Kreditozrouti ScraperResponseQueue queue is backing up
              description: More than 50 jobs have been waiting in ScraperResponseQueue for 15 minutes.
              dashboard: https://kreditozrouti.cz/grafana/d/kreditozrouti-service-api
  - name: "ScheduledJobStale: InSIS Gap Sweep (at 0:00, 4:00, 8:00, 12:00, 16:00, 20:00) running on time"
    interval: 1m
    input_series:
      - series: worker_last_success_timestamp_seconds{project="kreditozrouti", service="scraper", env="production", queue="q", job_name="InSIS Academic Schedules Request (daily at 1 AM)", instance="kreditozrouti-scraper-1"}
