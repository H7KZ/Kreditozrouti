# ==============================================================================
# Grafana Alerting: Alert Rules
# Three groups: infrastructure (host + container health), scraper (queue +
# staleness + failure rates), application (API error rate + latency).
# datasourceUid must match the uid in datasources/prometheus.yml.
#
# Every rule sets noDataState/execErrState to KeepLast: a Prometheus scrape gap
# (host OOM or container restart) must not fire phantom "DatasourceNoData" /
# datasource-error alerts. KeepLast retains a genuinely firing alert across the
# gap but reports Normal when the prior state was Normal (default is NoData,
# which caused the Discord alert-storm cascade). Valid values: NoData, Alerting,
# OK, KeepLast (noDataState) / Error, Alerting, OK, KeepLast (execErrState).
# ==============================================================================

apiVersion: 1

groups:
  - orgId: 1
    name: infrastructure
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: container-down
        title: API Down
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: 'The production API is down'
          description: 'The production API has been failing to scrape (up==0) or absent from discovery for more than 5 minutes. Users are affected.'
        labels:
          severity: critical
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              # Scoped to the user-facing PRODUCTION API only. The previous blanket `up == 0`
              # paged on every infra target (crowdsec, traefik); crowdsec binds 127.0.0.1 by
              # default so up{job="crowdsec"} was pinned to 0, producing a permanent, self-
              # repeating page. Alert on the symptom users feel, not on every scrape target.
              # up==0: target discovered but scrape failing. absent(): container gone from Docker SD.
              expr: up{job="kreditozrouti-api", env="production"} == 0 or absent(up{job="kreditozrouti-api", env="production"})
              instant: true
              refId: A

      - uid: mysql-backup-stale
        title: MySQL Backup Stale
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: 'No successful MySQL backup in 36 hours'
          description: 'The production MySQL dump has not succeeded in over 36 hours, or the backup metric is missing entirely. Check `systemctl status kreditozrouti-mysql-backup.timer` and `journalctl -u kreditozrouti-mysql-backup.service` on the host, then confirm recent dumps exist in ~/kreditozrouti/backups/production.'
        labels:
          severity: critical
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              # The absent() half is the whole point. A bare `time() - metric > X` returns
              # an empty vector when the series does not exist, so it is silently Normal in
              # exactly the failures this alert exists to catch: timer never installed,
              # timer disabled, Alloy not shipping, host down. The first half catches a
              # backup that stopped succeeding; the second catches one that stopped
              # reporting. Metric is pushed by Alloy from the host textfile collector -
              # see docs/adr/0001-backup-health-via-alloy-textfile.md.
              # 129600s = 36h: the timer is daily, so this tolerates one missed run plus
              # clock drift without flapping on a merely late backup.
              expr: (kreditozrouti_backup_last_success_timestamp_seconds{environment="production"} > 0 and time() - kreditozrouti_backup_last_success_timestamp_seconds{environment="production"} > 129600) or absent(kreditozrouti_backup_last_success_timestamp_seconds{environment="production"})
              instant: true
              refId: A

      - uid: mysql-backup-not-offsite
        title: MySQL Backup Not Replicated Offsite
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        # 5m matches the other infrastructure rules. The gauge is a steady 0 between
        # daily runs rather than a flapping rate, so `for` only guards scrape gaps here.
        for: 5m
        annotations:
          summary: 'Latest MySQL backup exists only on the VPS'
          description: 'The most recent production dump succeeded but was not replicated offsite, so the only copy lives on the same host as the database it protects. Backups are not yet stale - this is a redundancy gap, not data loss. Check the offsite upload step in scripts/backup-mysql.sh and the dumps in ~/kreditozrouti/backups/production.'
        labels:
          severity: warning
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              # No absent() guard here on purpose: a missing series means no backup metric
              # at all, which MySQL Backup Stale already pages on as critical. Duplicating
              # the absence check would send two Discord messages for one failure.
              expr: kreditozrouti_backup_offsite_replicated{environment="production"} == 0
              instant: true
              refId: A


  - orgId: 1
    name: scraper
    folder: Infrastructure
    interval: 1m
    rules:
      - uid: scraper-jobs-failed
        title: Scraper Jobs Failed
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: 'BullMQ scraper jobs are failing'
          description: 'Queue {{ $labels.queue }} has had {{ $values.A }} failed job(s) for more than 5 minutes. Check BullBoard for details.'
        labels:
          severity: critical
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: bullmq_queue_depth{queue=~"Scraper.*", status="failed"} > 0
              instant: true
              refId: A

      - uid: scraper-stale
        title: Scraper Stale
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: 'Scraper has not run in 24h'
          description: 'A scraper job has not run in more than 24 hours. Check cron schedule and Redis connectivity.'
        labels:
          severity: warning
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: (scraper_last_run_timestamp > 0) and (time() - scraper_last_run_timestamp > 86400)
              instant: true
              refId: A

      - uid: scraper-silent-failures-rising
        title: Scraper Silent Failures Rising
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        # 15m dampening: increase() over a sliding 30m window crosses the threshold and
        # resolves repeatedly as the window slides; for: 0m re-fired on every flap.
        for: 15m
        annotations:
          summary: 'Scraper silent failures rising'
          description: '{{ $values.A }} silent failures in the last 30 minutes. These are caught exceptions that do not fail BullMQ jobs.'
        labels:
          severity: warning
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: Prometheus
            model:
              expr: increase(scraper_silent_failures_total[30m]) > 5
              instant: true
              refId: A

      - uid: scraper-failure-rate-high
        title: Scraper Failure Rate High
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        for: 5m
        annotations:
          summary: 'Scraper item failure rate above 10%'
          description: 'More than 10% of scraped items are failing to process over the last 5 minutes.'
        labels:
          severity: warning
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: rate(scraper_items_processed_total{status="failure"}[5m]) / clamp_min(rate(scraper_items_processed_total{status="success"}[5m]) + rate(scraper_items_processed_total{status="failure"}[5m]), 0.00001) > 0.1
              instant: true
              refId: A

  - orgId: 1
    name: application
    folder: Application
    interval: 1m
    rules:
      - uid: api-error-rate-high
        title: API Error Rate High
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        for: 10m
        annotations:
          summary: 'API 5xx error rate above 5%'
          description: 'More than 5% of API requests are returning 5xx errors over the last 5 minutes.'
        labels:
          severity: warning
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: sum(rate(http_request_duration_seconds_count{status_code=~"5..",env="production"}[5m])) / sum(rate(http_request_duration_seconds_count{env="production"}[5m])) > 0.05
              instant: true
              refId: A

      - uid: api-p99-latency-high
        title: API p99 Latency High
        condition: A
        noDataState: KeepLast
        execErrState: KeepLast
        for: 10m
        annotations:
          summary: 'API p99 latency above 2 seconds'
          description: 'The 99th percentile API response time has exceeded 2 seconds over the last 5 minutes.'
        labels:
          severity: warning
        data:
          - refId: A
            queryType: ''
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus
            model:
              expr: histogram_quantile(0.99, sum by(le) (rate(http_request_duration_seconds_bucket{env="production"}[5m]))) > bool 2
              instant: true
              refId: A
