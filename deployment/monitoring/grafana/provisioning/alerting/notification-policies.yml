# ==============================================================================
# Grafana Alerting: Notification Policies
# Routes all alerts to the Discord contact point.
#
# group_by:        labels that define a notification group. Include job+env so a
#                  flap in one service does not re-notify unrelated alerts that
#                  happen to share the same alertname/severity.
# group_wait:      wait before sending the FIRST notification for a new group.
# group_interval:  wait before sending a notification about CHANGES in a group
#                  (a member firing/resolving). Kept at 15m so brief flaps during
#                  a deploy do not produce a fresh Discord message every few minutes.
# repeat_interval: re-notify an UNCHANGED still-firing group after this long.
# ==============================================================================

apiVersion: 1

policies:
  - orgId: 1
    receiver: discord
    group_by: [ alertname, job, env, severity ]
    group_wait: 30s
    group_interval: 15m
    repeat_interval: 24h
