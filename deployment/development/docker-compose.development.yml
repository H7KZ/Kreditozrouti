# ==============================================================================
# Docker Compose: Development Environment
# Description: Full application stack for development deployment.
#
# Services:
#   - api: Backend API service (NestJS/Express)
#   - client: Frontend client (React/Next.js)
#   - scraper: Background scraper workers
#   - mysql: Database server
#   - redis: Cache and queue server
#   - phpmyadmin: Database management UI
#
# Required Environment Variables:
#   - IMAGE_REGISTRY, IMAGE_PREFIX: Container image registry config
#   - API_IMAGE_TAG, CLIENT_IMAGE_TAG, SCRAPER_IMAGE_TAG: Per-service image tags
#   - DOMAIN: Primary domain for routing
#   - PROJECT: Project name for Traefik labels
#   - MYSQL_*: Database credentials
#   - REDIS_*: Cache credentials
#   - API_*: API configuration
#
# Image Pinning Policy:
#   Third-party images are pinned to a major tag, never `latest`. Every deploy runs
#   `docker compose pull`, so a floating tag can silently carry a stateful service across a
#   major version, and for a database that is not reversible.
#
# Router Naming:
#   Every Traefik router/middleware name below is prefixed with ${PROJECT}, and production uses
#   the same shape. PROJECT comes from the GitHub Environment variable `vars.PROJECT`, which is
#   scoped per environment (see .github/workflows/_deploy-service.yml), so it MUST be set to a
#   different value here than in production. Both stacks register with the one shared
#   Infrastructure Traefik; identical router names would collide there and one environment
#   would silently take over the other's routes. Do not drop the ${PROJECT} prefix.
#
# Usage: docker compose -f docker-compose.development.yml up -d
# ==============================================================================

services:
  # ============================================================================
  # API Service
  # ============================================================================
  api:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/api:${API_IMAGE_TAG:-dev-latest}
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      - ENV=development
      - NODE_ENV=development
      - API_PORT=80
      - API_URI=https://${DOMAIN}/api
      - API_DOMAIN=${DOMAIN}
      - API_ALLOWED_ORIGINS=https://${DOMAIN}
      - API_SESSION_SECRET=${API_SESSION_SECRET}
      - API_COMMAND_TOKEN=${API_COMMAND_TOKEN}
      - GOOGLE_USER=${GOOGLE_USER}
      - GOOGLE_APP_PASSWORD=${GOOGLE_APP_PASSWORD}
      - CLIENT_URI=https://${DOMAIN}
      - MYSQL_URI=${MYSQL_URI}
      - REDIS_URI=${REDIS_URI}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - public-network
      - kreditozrouti-mysql-network-dev
      - kreditozrouti-redis-network-dev
      - kreditozrouti-monitoring-network

    labels:
      # Traefik Configuration
      - 'traefik.enable=true'
      - 'traefik.http.routers.kreditozrouti-api-${PROJECT}.priority=100'
      - 'traefik.http.routers.kreditozrouti-api-${PROJECT}.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.kreditozrouti-api-${PROJECT}.entrypoints=websecure'
      - 'traefik.http.routers.kreditozrouti-api-${PROJECT}.tls=true'
      - 'traefik.http.routers.kreditozrouti-api-${PROJECT}.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.kreditozrouti-api-${PROJECT}.loadbalancer.server.port=80'
      # Middlewares
      - 'traefik.http.routers.kreditozrouti-api-${PROJECT}.middlewares=kreditozrouti-api-${PROJECT}-stripprefix,kreditozrouti-api-${PROJECT}-redirect-www'
      - 'traefik.http.middlewares.kreditozrouti-api-${PROJECT}-stripprefix.stripprefix.prefixes=/api'
      - "traefik.http.middlewares.kreditozrouti-api-${PROJECT}-redirect-www.redirectregex.regex=^https://www\\.(.*)"
      - 'traefik.http.middlewares.kreditozrouti-api-${PROJECT}-redirect-www.redirectregex.replacement=https://$${1}'
      # Prometheus Service Discovery
      - 'prometheus.io/scrape=true'
      - 'prometheus.io/env=development'
      - 'prometheus.io/port=80'

    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:80/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  # ============================================================================
  # Scraper Service
  # ============================================================================
  scraper:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/scraper:${SCRAPER_IMAGE_TAG:-dev-latest}
    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    # Global ceiling on outbound requests to InSIS, enforced in Redis by
    # InSISRateLimitService so it holds across replicas and across every job's internal
    # fan-out. Deliberately lower than production: development shares the same InSIS,
    # and a dev scrape running alongside a production one must not double the load a
    # single university system sees. See docs/adr/0002-global-insis-rate-limit-not-a-concurrency-knob.md.
    environment:
      - ENV=development
      - REDIS_URI=${REDIS_URI}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INSIS_RATE_LIMIT_RPS=${INSIS_RATE_LIMIT_RPS:-2}
      - INSIS_RATE_LIMIT_BURST=${INSIS_RATE_LIMIT_BURST:-4}
      - INSIS_RATE_LIMIT_MAX_WAIT_MS=${INSIS_RATE_LIMIT_MAX_WAIT_MS:-30000}
    networks:
      - kreditozrouti-redis-network-dev
      - kreditozrouti-monitoring-network

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ============================================================================
  # Client Service
  # ============================================================================
  client:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/client:${CLIENT_IMAGE_TAG:-dev-latest}
    restart: unless-stopped

    depends_on:
      - api

    environment:
      - ENV=development
      - VITE_API_URL=https://${DOMAIN}/api
      - VITE_FARO_COLLECTOR_URL=https://${DOMAIN}/faro/collect
      - VITE_APP_VERSION=${CLIENT_IMAGE_TAG:-dev-latest}
      - VITE_APP_ENV=development
      - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID}
      - VITE_UMAMI_SRC=${VITE_UMAMI_SRC}

    networks:
      - public-network

    labels:
      # Traefik Configuration
      - 'traefik.enable=true'
      - 'traefik.http.routers.kreditozrouti-client-${PROJECT}.priority=10'
      - 'traefik.http.routers.kreditozrouti-client-${PROJECT}.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.kreditozrouti-client-${PROJECT}.entrypoints=websecure'
      - 'traefik.http.routers.kreditozrouti-client-${PROJECT}.tls=true'
      - 'traefik.http.routers.kreditozrouti-client-${PROJECT}.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.kreditozrouti-client-${PROJECT}.loadbalancer.server.port=80'
      # Middlewares
      - 'traefik.http.routers.kreditozrouti-client-${PROJECT}.middlewares=kreditozrouti-client-${PROJECT}-redirect-www'
      - "traefik.http.middlewares.kreditozrouti-client-${PROJECT}-redirect-www.redirectregex.regex=^https://www\\.(.*)"
      - 'traefik.http.middlewares.kreditozrouti-client-${PROJECT}-redirect-www.redirectregex.replacement=https://$${1}'

    healthcheck:
      # busybox wget, not curl. The client image's runner stage is nginx:stable-alpine, which
      # never installs curl (only api/Dockerfile and mcp/Dockerfile do), so the previous curl
      # check could not execute at all and the container stayed permanently unhealthy - which
      # in turn kept the container-health alert firing. busybox wget ships in the nginx alpine
      # image; `--spider` fetches headers only and exits non-zero on a non-2xx response.
      #
      # 127.0.0.1, not localhost: the entrypoint's 10-listen-on-ipv6-by-default.sh patches
      # default.conf to listen on both stacks, but 20-envsubst-on-templates.sh runs after it and
      # regenerates default.conf from the template from scratch, silently dropping that IPv6
      # listen directive - nginx ends up bound to 0.0.0.0:80 only. musl's getaddrinfo (this is
      # Alpine) resolves "localhost" to ::1 first, so wget tried the IPv6 loopback, got refused,
      # and never fell back to IPv4 - the container was permanently unhealthy despite serving
      # requests over IPv4 the whole time. 127.0.0.1 skips resolution entirely.
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:80' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # MCP Service
  # ============================================================================
  mcp:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/mcp:${MCP_IMAGE_TAG:-dev-latest}
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      - NODE_ENV=development
      - MYSQL_URI=${MYSQL_URI}
      - MCP_PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_BASE_URL=https://${DOMAIN}
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}

    networks:
      - public-network
      - kreditozrouti-mysql-network-dev

    labels:
      # Traefik Configuration
      - 'traefik.enable=true'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}.priority=50'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}.rule=Host(`${DOMAIN}`) && PathPrefix(`/mcp`)'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}.entrypoints=websecure'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}.tls=true'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.kreditozrouti-mcp-${PROJECT}.loadbalancer.server.port=3000'
      # OAuth well-known discovery endpoints (must be served from root domain)
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}-wellknown.priority=60'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}-wellknown.rule=Host(`${DOMAIN}`) && PathPrefix(`/.well-known/oauth`)'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}-wellknown.entrypoints=websecure'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}-wellknown.tls=true'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}-wellknown.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.routers.kreditozrouti-mcp-${PROJECT}-wellknown.service=kreditozrouti-mcp-${PROJECT}'

    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:3000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

  # ============================================================================
  # Database (MySQL)
  # ============================================================================
  mysql:
    image: mysql:26.7.0
    restart: unless-stopped

    volumes:
      - kreditozrouti-mysql-volume-dev:/var/lib/mysql

    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}

    command:
      - --sort_buffer_size=32M
      - --read_buffer_size=16M
      - --read_rnd_buffer_size=16M
      - --join_buffer_size=16M
      - --max_sort_length=8192
      - --innodb_sort_buffer_size=32M
      - --tmp_table_size=32M
      - --max_heap_table_size=32M
      - --innodb_buffer_pool_size=256M

    networks:
      - kreditozrouti-mysql-network-dev

    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '1.5'
          memory: 1024M
        reservations:
          cpus: '0.5'
          memory: 384M

  # ============================================================================
  # Database Interface (phpMyAdmin)
  #
  # Loopback only. The container publishes on 127.0.0.1:48081, so nothing outside the host can
  # reach it. Open it from a workstation over an SSH tunnel instead:
  #
  #   ssh -L 48081:127.0.0.1:48081 <user>@<host>     then browse http://localhost:48081
  #
  # The port differs from production's 48080 on purpose: both stacks run on the same VPS, and
  # two services asking for the same host port would refuse to start. No other service in this
  # repo's deployment stacks publishes a host port, so 48080/48081 are the only two in use.
  #
  # It sits behind the `admin` profile, so a normal `docker compose up -d` (and therefore every
  # deploy) leaves it stopped. Start it only for the duration of the work:
  #
  #   docker compose --profile admin up -d phpmyadmin
  #   docker compose --profile admin stop phpmyadmin
  #
  # It deliberately carries NO Traefik labels and is NOT attached to public-network, so the
  # shared Infrastructure Traefik has nothing to route here even if the container is left
  # running. PMA_ARBITRARY is gone for the same reason: it turned this container into an open
  # MySQL client that would dial any host a visitor typed into the login form. PMA_ABSOLUTE_URI
  # is gone too - it only existed to make the stripped /phpmyadmin path prefix work.
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:5.2.3
    # Never started by a plain `up`; see the comment above.
    profiles: [ 'admin' ]
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - UPLOAD_LIMIT=2G

    ports:
      # Bound to the loopback interface explicitly - a bare '48081:80' would publish on every
      # interface and undo the whole point of this change.
      - '127.0.0.1:48081:80'

    networks:
      # Only the MySQL network. No public-network membership.
      - kreditozrouti-mysql-network-dev

    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # Cache (Redis)
  # ============================================================================
  redis:
    # Pinned to major 8. The AOF file in the named volume survives restarts, so an unnoticed
    # major bump from a floating tag would be a persistence format change nobody reviewed.
    image: redis:8.10.1-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - '20'
      - '1'
      - --appendonly
      - 'yes'
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

    volumes:
      - kreditozrouti-redis-volume-dev:/data

    networks:
      - kreditozrouti-redis-network-dev

    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M
