# ==============================================================================
# Docker Compose: Production Environment
# Description: Full application stack for production deployment.
#
# Services:
#   - api: Backend API service (NestJS/Express)
#   - client: Frontend client (React/Next.js)
#   - scraper: Background scraper workers
#   - mysql: Database server
#   - redis: Cache and queue server
#   - phpmyadmin: Database management UI
#
# Required Environment Variables:
#   - IMAGE_REGISTRY, IMAGE_PREFIX: Container image registry config
#   - API_IMAGE_TAG, CLIENT_IMAGE_TAG, SCRAPER_IMAGE_TAG: Per-service image tags
#   - DOMAIN: Primary domain for routing
#   - PROJECT: Project name for Traefik labels
#   - MYSQL_*: Database credentials
#   - REDIS_*: Cache credentials
#   - API_*: API configuration
#
# Image Pinning Policy:
#   Third-party images are pinned to a major tag, never `latest`. Every deploy runs
#   `docker compose pull`, so a floating tag can silently carry a stateful service across a
#   major version, and for a database that is not reversible.
#
# Usage: docker compose -f docker-compose.production.yml up -d
# ==============================================================================

services:
  # ============================================================================
  # API Service
  # ============================================================================
  api:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/api:${API_IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      - ENV=production
      - NODE_ENV=production
      - API_PORT=80
      - API_URI=https://${DOMAIN}/api
      - API_DOMAIN=${DOMAIN}
      - API_ALLOWED_ORIGINS=https://${DOMAIN}
      - API_SESSION_SECRET=${API_SESSION_SECRET}
      - API_COMMAND_TOKEN=${API_COMMAND_TOKEN}
      - GOOGLE_USER=${GOOGLE_USER}
      - GOOGLE_APP_PASSWORD=${GOOGLE_APP_PASSWORD}
      - CLIENT_URI=https://${DOMAIN}
      - MYSQL_URI=${MYSQL_URI}
      - REDIS_URI=${REDIS_URI}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    networks:
      - public-network
      - kreditozrouti-mysql-network-prod
      - kreditozrouti-redis-network-prod
      - kreditozrouti-monitoring-network

    labels:
      # Traefik Configuration
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT}-api.priority=100'
      - 'traefik.http.routers.${PROJECT}-api.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.${PROJECT}-api.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT}-api.tls=true'
      - 'traefik.http.routers.${PROJECT}-api.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.${PROJECT}-api.loadbalancer.server.port=80'
      # Middlewares
      - 'traefik.http.routers.${PROJECT}-api.middlewares=${PROJECT}-api-stripprefix,${PROJECT}-api-redirect-www'
      - 'traefik.http.middlewares.${PROJECT}-api-stripprefix.stripprefix.prefixes=/api'
      - "traefik.http.middlewares.${PROJECT}-api-redirect-www.redirectregex.regex=^https://www\\.(.*)"
      - 'traefik.http.middlewares.${PROJECT}-api-redirect-www.redirectregex.replacement=https://$${1}'
      # Prometheus Service Discovery
      - 'prometheus.io/scrape=true'
      - 'prometheus.io/env=production'
      - 'prometheus.io/port=80'

    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:80/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback
      rollback_config:
        parallelism: 1
        delay: 10s
        order: stop-first

  # ============================================================================
  # Scraper Service
  # ============================================================================
  scraper:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/scraper:${SCRAPER_IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      redis:
        condition: service_healthy

    # Global ceiling on outbound requests to InSIS, enforced in Redis by
    # InSISRateLimitService so it holds across BOTH replicas and across every job's
    # internal fan-out. This is the only safety knob: do not add a worker-concurrency
    # env var, because this service's parallelism is multiplicative and such a knob
    # would sit on top of the product. See docs/adr/0002-global-insis-rate-limit-not-a-concurrency-knob.md.
    #
    # Set here rather than in .env so retuning is a compose change, not an image rebuild.
    environment:
      - ENV=production
      - REDIS_URI=${REDIS_URI}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - INSIS_RATE_LIMIT_RPS=${INSIS_RATE_LIMIT_RPS:-4}
      - INSIS_RATE_LIMIT_BURST=${INSIS_RATE_LIMIT_BURST:-8}
      - INSIS_RATE_LIMIT_MAX_WAIT_MS=${INSIS_RATE_LIMIT_MAX_WAIT_MS:-30000}
    networks:
      - kreditozrouti-redis-network-prod
      - kreditozrouti-monitoring-network

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 384M
        reservations:
          cpus: '0.1'
          memory: 128M
      update_config:
        parallelism: 1
        delay: 5s
        order: start-first

  # ============================================================================
  # Client Service
  # ============================================================================
  client:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/client:${CLIENT_IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      - api

    environment:
      - ENV=production
      - VITE_API_URL=https://${DOMAIN}/api
      - VITE_FARO_COLLECTOR_URL=https://${DOMAIN}/faro/collect
      - VITE_APP_VERSION=${CLIENT_IMAGE_TAG:-latest}
      - VITE_APP_ENV=production
      - VITE_UMAMI_WEBSITE_ID=${VITE_UMAMI_WEBSITE_ID}
      - VITE_UMAMI_SRC=${VITE_UMAMI_SRC}

    networks:
      - public-network

    labels:
      # Traefik Configuration
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT}-client.priority=10'
      - 'traefik.http.routers.${PROJECT}-client.rule=Host(`${DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT}-client.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT}-client.tls=true'
      - 'traefik.http.routers.${PROJECT}-client.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.${PROJECT}-client.loadbalancer.server.port=80'
      # Middlewares
      - 'traefik.http.routers.${PROJECT}-client.middlewares=${PROJECT}-client-redirect-www'
      - "traefik.http.middlewares.${PROJECT}-client-redirect-www.redirectregex.regex=^https://www\\.(.*)"
      - 'traefik.http.middlewares.${PROJECT}-client-redirect-www.redirectregex.replacement=https://$${1}'

    healthcheck:
      # busybox wget, not curl. The client image's runner stage is nginx:stable-alpine, which
      # never installs curl (only api/Dockerfile and mcp/Dockerfile do), so the previous curl
      # check could not execute at all and the container stayed permanently unhealthy - which
      # in turn kept the container-health alert firing. busybox wget ships in the nginx alpine
      # image; `--spider` fetches headers only and exits non-zero on a non-2xx response.
      test: [ 'CMD', 'wget', '--spider', '-q', 'http://localhost:80' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first

  # ============================================================================
  # MCP Service
  # ============================================================================
  mcp:
    image: ${IMAGE_REGISTRY}/${IMAGE_PREFIX}/mcp:${MCP_IMAGE_TAG:-latest}
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      - NODE_ENV=production
      - MYSQL_URI=${MYSQL_URI}
      - MCP_PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MCP_BASE_URL=https://${DOMAIN}
      - MCP_JWT_SECRET=${MCP_JWT_SECRET}

    networks:
      - public-network
      - kreditozrouti-mysql-network-prod

    labels:
      # Traefik Configuration
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT}-mcp.priority=50'
      - 'traefik.http.routers.${PROJECT}-mcp.rule=Host(`${DOMAIN}`) && PathPrefix(`/mcp`)'
      - 'traefik.http.routers.${PROJECT}-mcp.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT}-mcp.tls=true'
      - 'traefik.http.routers.${PROJECT}-mcp.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.services.${PROJECT}-mcp.loadbalancer.server.port=3000'
      # OAuth well-known discovery endpoints (must be served from root domain)
      - 'traefik.http.routers.${PROJECT}-mcp-wellknown.priority=60'
      - 'traefik.http.routers.${PROJECT}-mcp-wellknown.rule=Host(`${DOMAIN}`) && PathPrefix(`/.well-known/oauth`)'
      - 'traefik.http.routers.${PROJECT}-mcp-wellknown.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT}-mcp-wellknown.tls=true'
      - 'traefik.http.routers.${PROJECT}-mcp-wellknown.tls.certresolver=letsencrypt-dns'
      - 'traefik.http.routers.${PROJECT}-mcp-wellknown.service=${PROJECT}-mcp'

    healthcheck:
      test: [ 'CMD', 'curl', '-f', 'http://localhost:3000/health' ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    deploy:
      mode: replicated
      replicas: 1
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
        failure_action: rollback

  # ============================================================================
  # Database (MySQL)
  # ============================================================================
  mysql:
    image: mysql:8
    restart: unless-stopped

    volumes:
      - kreditozrouti-mysql-volume-prod:/var/lib/mysql

    environment:
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}

    command:
      - --sort_buffer_size=64M
      - --read_buffer_size=32M
      - --read_rnd_buffer_size=32M
      - --join_buffer_size=32M
      - --max_sort_length=8192
      - --innodb_sort_buffer_size=64M
      - --tmp_table_size=64M
      - --max_heap_table_size=64M
      - --innodb_buffer_pool_size=512M

    networks:
      - kreditozrouti-mysql-network-prod

    healthcheck:
      test: [ 'CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-p${MYSQL_ROOT_PASSWORD}' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ============================================================================
  # Database Interface (phpMyAdmin)
  #
  # Loopback only. The container publishes on 127.0.0.1:48080, so nothing outside the host can
  # reach it. Open it from a workstation over an SSH tunnel instead:
  #
  #   ssh -L 48080:127.0.0.1:48080 <user>@<host>     then browse http://localhost:48080
  #
  # It sits behind the `admin` profile, so a normal `docker compose up -d` (and therefore every
  # deploy) leaves it stopped. Start it only for the duration of the work:
  #
  #   docker compose --profile admin up -d phpmyadmin
  #   docker compose --profile admin stop phpmyadmin
  #
  # It deliberately carries NO Traefik labels and is NOT attached to public-network, so the
  # shared Infrastructure Traefik has nothing to route here even if the container is left
  # running. PMA_ARBITRARY is gone for the same reason: it turned this container into an open
  # MySQL client that would dial any host a visitor typed into the login form. PMA_ABSOLUTE_URI
  # is gone too - it only existed to make the stripped /phpmyadmin path prefix work.
  # ============================================================================
  phpmyadmin:
    image: phpmyadmin:5
    # Never started by a plain `up`; see the comment above.
    profiles: ['admin']
    restart: unless-stopped

    depends_on:
      mysql:
        condition: service_healthy

    environment:
      - PMA_HOST=mysql
      - PMA_PORT=3306
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - UPLOAD_LIMIT=2G

    ports:
      # Bound to the loopback interface explicitly - a bare '48080:80' would publish on every
      # interface and undo the whole point of this change.
      - '127.0.0.1:48080:80'

    networks:
      # Only the MySQL network. No public-network membership.
      - kreditozrouti-mysql-network-prod

    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # Cache (Redis)
  # ============================================================================
  redis:
    # Pinned to major 8. The AOF file in the named volume survives restarts, so an unnoticed
    # major bump from a floating tag would be a persistence format change nobody reviewed.
    image: redis:8-alpine
    restart: unless-stopped

    command:
      - redis-server
      - --save
      - '60'
      - '1'
      - --appendonly
      - 'yes'
      - --loglevel
      - warning
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction

    volumes:
      - kreditozrouti-redis-volume-prod:/data

    networks:
      - kreditozrouti-redis-network-prod

    healthcheck:
      test: [ 'CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping' ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

    logging:
      driver: 'json-file'
      options:
        max-size: '5m'
        max-file: '2'

    deploy:
      mode: global
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
