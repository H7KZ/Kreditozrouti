# ==============================================================================
# Workflow: Deploy
# Description: Unified deploy for all services.
#              On push to main: auto-deploys only the services whose paths changed.
#              On manual dispatch: select any combination via checkboxes.
#
#              CI gate: every run - push and manual dispatch alike - first calls
#              _verify.yml (the same checks the PR pipeline runs). `validate`
#              needs that gate, and every build, resolve, deploy and cleanup job
#              already keys off `validate`, so a failed verification skips the
#              whole graph and nothing unverified reaches the VPS. A dispatch
#              with skip_build is gated too: it still deploys to the server.
#
# Trigger: push to main (path-filtered), or manual dispatch
#
# Required Secrets: inherited by the reusable workflows this calls -
#                   see _verify.yml, _build-service.yml, _deploy-service.yml
# ==============================================================================

name: Deploy

on:
  push:
    branches: [ main ]
    paths:
      - 'api/**'
      - 'client/**'
      - 'scraper/**'
      - 'mcp/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [ production, development ]
        default: production
      deploy_api:
        description: Deploy API
        type: boolean
        default: true
      deploy_client:
        description: Deploy Client
        type: boolean
        default: true
      deploy_scraper:
        description: Deploy Scraper
        type: boolean
        default: true
      deploy_mcp:
        description: Deploy MCP
        type: boolean
        default: true
      image_tag:
        description: Specific image tag to deploy (skips build if set)
        required: false
        type: string
        default: ''
      skip_build:
        description: Skip build (images must already exist in registry)
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # CI gate - the same checks verify.yml runs on pull requests. Deliberately
  # unconditional: a workflow_dispatch (including one with skip_build) still
  # pushes to the VPS, so it is gated exactly like a push to main.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify Code
    uses: ./.github/workflows/_verify.yml

  # ---------------------------------------------------------------------------
  # Validate dispatch inputs before any work starts.
  # `needs: verify` is the single choke point of this workflow: every build,
  # resolve, deploy and cleanup job already requires validate to have succeeded,
  # so a failed verification skips validate and with it the entire graph.
  # ---------------------------------------------------------------------------
  validate:
    name: Validate Inputs
    runs-on: self-hosted
    timeout-minutes: 5
    needs: [ verify ]
    steps:
      - name: Reject skip_build without image_tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "${{ inputs.skip_build }}" == "true" && -z "${{ inputs.image_tag }}" ]]; then
            echo "ERROR: image_tag must be set when skip_build is true"
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Detect which services changed (push only - dispatch uses checkbox inputs)
  # ---------------------------------------------------------------------------
  detect:
    name: Detect Changed Services
    runs-on: self-hosted
    if: github.event_name == 'push'
    timeout-minutes: 5
    outputs:
      api: ${{ steps.filter.outputs.api }}
      client: ${{ steps.filter.outputs.client }}
      scraper: ${{ steps.filter.outputs.scraper }}
      mcp: ${{ steps.filter.outputs.mcp }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - 'packages/**'
            client:
              - 'client/**'
              - 'packages/**'
            scraper:
              - 'scraper/**'
              - 'packages/**'
            mcp:
              - 'mcp/**'
              - 'packages/**'

  # ---------------------------------------------------------------------------
  # Build (parallel, each conditional on service selection)
  # ---------------------------------------------------------------------------
  build-api:
    name: Build API
    needs: [ detect, validate ]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.detect.result != 'failure' &&
      (
        (github.event_name == 'push' && needs.detect.outputs.api == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_api && !inputs.skip_build && inputs.image_tag == '')
      )
    uses: ./.github/workflows/_build-service.yml
    with:
      service: api
      float_tag: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'latest' || 'dev-latest' }}
      cache_scope: api-${{ (github.event_name == 'push' || inputs.environment == 'production') && 'prod' || 'dev' }}
    secrets: inherit

  build-client:
    name: Build Client
    needs: [ detect, validate ]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.detect.result != 'failure' &&
      (
        (github.event_name == 'push' && needs.detect.outputs.client == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_client && !inputs.skip_build && inputs.image_tag == '')
      )
    uses: ./.github/workflows/_build-service.yml
    with:
      service: client
      float_tag: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'latest' || 'dev-latest' }}
      cache_scope: client-${{ (github.event_name == 'push' || inputs.environment == 'production') && 'prod' || 'dev' }}
    secrets: inherit

  build-scraper:
    name: Build Scraper
    needs: [ detect, validate ]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.detect.result != 'failure' &&
      (
        (github.event_name == 'push' && needs.detect.outputs.scraper == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_scraper && !inputs.skip_build && inputs.image_tag == '')
      )
    uses: ./.github/workflows/_build-service.yml
    with:
      service: scraper
      float_tag: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'latest' || 'dev-latest' }}
      cache_scope: scraper-${{ (github.event_name == 'push' || inputs.environment == 'production') && 'prod' || 'dev' }}
    secrets: inherit

  build-mcp:
    name: Build MCP
    needs: [ detect, validate ]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      needs.detect.result != 'failure' &&
      (
        (github.event_name == 'push' && needs.detect.outputs.mcp == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_mcp && !inputs.skip_build && inputs.image_tag == '')
      )
    uses: ./.github/workflows/_build-service.yml
    with:
      service: mcp
      float_tag: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'latest' || 'dev-latest' }}
      cache_scope: mcp-${{ (github.event_name == 'push' || inputs.environment == 'production') && 'prod' || 'dev' }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Resolve image prefix - always github.repository lowercased; derived from
  # a build output to stay consistent with _build-service.yml
  # ---------------------------------------------------------------------------
  resolve:
    name: Resolve Image Prefix
    runs-on: self-hosted
    timeout-minutes: 5
    needs: [ validate, detect, build-api, build-client, build-scraper, build-mcp ]
    if: always() && needs.validate.result == 'success' && needs.detect.result != 'failure'
    outputs:
      image_prefix: ${{ steps.prefix.outputs.value }}
    steps:
      - name: Compute lowercase prefix
        id: prefix
        run: |
          RAW="${{ needs.build-api.outputs.image_prefix || needs.build-client.outputs.image_prefix || needs.build-scraper.outputs.image_prefix || needs.build-mcp.outputs.image_prefix || github.repository }}"
          echo "value=${RAW,,}" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Deploy (parallel per service, each conditional on service selection)
  # ---------------------------------------------------------------------------
  deploy-api:
    name: Deploy API
    needs: [ detect, build-api, resolve ]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (
        (github.event_name == 'push' && needs.detect.outputs.api == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_api)
      )
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: api
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      project_name: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'kreditozrouti' || 'kreditozrouti-dev' }}
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build-api.outputs.image_tag }}
      image_prefix: ${{ needs.resolve.outputs.image_prefix }}
    secrets: inherit

  deploy-client:
    name: Deploy Client
    needs: [ detect, build-client, resolve ]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (needs.build-client.result == 'success' || needs.build-client.result == 'skipped') &&
      (
        (github.event_name == 'push' && needs.detect.outputs.client == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_client)
      )
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: client
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      project_name: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'kreditozrouti' || 'kreditozrouti-dev' }}
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build-client.outputs.image_tag }}
      image_prefix: ${{ needs.resolve.outputs.image_prefix }}
    secrets: inherit

  deploy-scraper:
    name: Deploy Scraper
    needs: [ detect, build-scraper, resolve ]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (needs.build-scraper.result == 'success' || needs.build-scraper.result == 'skipped') &&
      (
        (github.event_name == 'push' && needs.detect.outputs.scraper == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_scraper)
      )
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: scraper
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      project_name: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'kreditozrouti' || 'kreditozrouti-dev' }}
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build-scraper.outputs.image_tag }}
      image_prefix: ${{ needs.resolve.outputs.image_prefix }}
    secrets: inherit

  deploy-mcp:
    name: Deploy MCP
    needs: [ detect, build-mcp, resolve ]
    if: >-
      always() &&
      needs.resolve.result == 'success' &&
      (needs.build-mcp.result == 'success' || needs.build-mcp.result == 'skipped') &&
      (
        (github.event_name == 'push' && needs.detect.outputs.mcp == 'true') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy_mcp)
      )
    uses: ./.github/workflows/_deploy-service.yml
    with:
      service: mcp
      environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'production' }}
      project_name: ${{ (github.event_name == 'push' || inputs.environment == 'production') && 'kreditozrouti' || 'kreditozrouti-dev' }}
      image_tag: ${{ inputs.image_tag != '' && inputs.image_tag || needs.build-mcp.outputs.image_tag }}
      image_prefix: ${{ needs.resolve.outputs.image_prefix }}
    secrets: inherit

  # ---------------------------------------------------------------------------
  # Cleanup old package versions after successful deploy
  # ---------------------------------------------------------------------------
  cleanup-api:
    name: Cleanup API packages
    needs: [ deploy-api ]
    if: needs.deploy-api.result == 'success'
    uses: ./.github/workflows/_cleanup-package.yml
    with:
      package-name: kreditozrouti/api
    secrets: inherit

  cleanup-client:
    name: Cleanup Client packages
    needs: [ deploy-client ]
    if: needs.deploy-client.result == 'success'
    uses: ./.github/workflows/_cleanup-package.yml
    with:
      package-name: kreditozrouti/client
    secrets: inherit

  cleanup-scraper:
    name: Cleanup Scraper packages
    needs: [ deploy-scraper ]
    if: needs.deploy-scraper.result == 'success'
    uses: ./.github/workflows/_cleanup-package.yml
    with:
      package-name: kreditozrouti/scraper
    secrets: inherit

  cleanup-mcp:
    name: Cleanup MCP packages
    needs: [ deploy-mcp ]
    if: needs.deploy-mcp.result == 'success'
    uses: ./.github/workflows/_cleanup-package.yml
    with:
      package-name: kreditozrouti/mcp
    secrets: inherit
