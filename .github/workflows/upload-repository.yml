# ==============================================================================
# Workflow: Upload Repository to VPS
# Description: Manually uploads repository contents to the VPS.
#              Useful for initial setup or full repository syncs.
# Trigger: Manual dispatch only (workflow_dispatch)
#
# Inputs:
#   - branch: Branch to upload (default: main)
#   - target_folder: Destination folder on VPS (default: repository)
#   - clean_target: Remove existing files before upload (default: false)
#
# Required Secrets:
#   - SSH_HOST: VPS hostname or IP
#   - SSH_USER: SSH username
#   - SSH_PORT: SSH port
#   - SSH_PRIVATE_KEY: SSH private key for authentication
#   - SSH_HOST_FINGERPRINT: trusted SHA256 host fingerprint
# ==============================================================================

name: Upload Repository

on:
    workflow_dispatch:
        inputs:
            branch:
                description: 'Branch to upload'
                required: true
                default: 'main'
                type: string
            target_folder:
                description: 'Target folder on VPS (relative to home, no .. allowed)'
                required: true
                default: 'kreditozrouti'
                type: string
            clean_target:
                description: 'Remove existing files before upload'
                required: true
                default: false
                type: boolean

permissions:
    contents: read

jobs:
    upload:
        name: Upload to VPS
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - name: Validate Inputs
              id: validated
              env:
                  INPUT_FOLDER: ${{ inputs.target_folder }}
              run: |
                  set -euo pipefail
                  if [[ ! "$INPUT_FOLDER" =~ ^[A-Za-z0-9][A-Za-z0-9_-]{0,63}$ ]]; then
                    echo "ERROR: target_folder must be one safe relative directory name"
                    exit 1
                  fi
                  echo "folder=$INPUT_FOLDER" >> "$GITHUB_OUTPUT"

            - name: Checkout Code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ inputs.branch }}

            - name: Require a pinned SSH host fingerprint
              env:
                  SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
              run: |
                  set -euo pipefail
                  [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || {
                    echo "ERROR: SSH_HOST_FINGERPRINT must contain the trusted SHA256 host fingerprint"
                    exit 1
                  }

            - name: Display Configuration
              env:
                  BRANCH: ${{ inputs.branch }}
                  TARGET_FOLDER: ${{ steps.validated.outputs.folder }}
                  CLEAN: ${{ inputs.clean_target }}
              run: |
                  echo "=========================================="
                  echo "Upload Configuration"
                  echo "=========================================="
                  echo "Branch: $BRANCH"
                  echo "Target: ~/$TARGET_FOLDER"
                  echo "Clean:  $CLEAN"
                  echo "=========================================="

            - name: Prepare Target Directory
              if: ${{ inputs.clean_target }}
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
              env:
                  TARGET_FOLDER: ${{ steps.validated.outputs.folder }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_FOLDER
                  script: |
                      set -euo pipefail
                      TARGET_DIR="$HOME/$TARGET_FOLDER"
                      if [[ -d "$TARGET_DIR" ]]; then
                          echo "Cleaning target directory: $TARGET_DIR"
                          rm -rf "$TARGET_DIR"
                      fi
                      mkdir -p "$TARGET_DIR"

            - name: Upload Repository
              uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  source: '.'
                  target: '~/${{ steps.validated.outputs.folder }}'
                  rm: false

            - name: Verify Upload
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
              env:
                  TARGET_FOLDER: ${{ steps.validated.outputs.folder }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_FOLDER
                  script: |
                      set -euo pipefail
                      echo "=========================================="
                      echo "Upload Verification"
                      echo "=========================================="
                      echo "Size: $(du -sh "$HOME/$TARGET_FOLDER" | cut -f1)"
                      echo "Files: $(find "$HOME/$TARGET_FOLDER" -type f | wc -l)"
                      echo "=========================================="
