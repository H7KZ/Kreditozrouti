name: Deploy environment snapshot (reusable)
'on':
    workflow_call:
        inputs:
            environment:
                required: true
                type: string
            source_commit:
                required: true
                type: string
            qualified_release_manifest_b64:
                required: false
                type: string
                default: ''
            qualified_manifest_sha256:
                required: false
                type: string
                default: ''
            api_digest:
                required: false
                type: string
                default: ''
            web_digest:
                required: false
                type: string
                default: ''
            scraper_digest:
                required: false
                type: string
                default: ''
            mcp_digest:
                required: false
                type: string
                default: ''
permissions:
    contents: read
    packages: read
jobs:
    deploy:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        environment: ${{ inputs.environment }}
        steps:
            - name: Require main and trusted SSH fingerprint
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  WORKFLOW_REF: ${{ github.ref }}
                  SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
              run: |
                  set -euo pipefail
                  [[ "$WORKFLOW_REF" == refs/heads/main ]] || { echo 'ERROR: deployment requires main'; exit 1; }
                  [[ "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ ]] || exit 1
                  [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || { echo 'ERROR: trusted SSH fingerprint required'; exit 1; }
            - name: Checkout controller
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  path: controller
            - name: Checkout selected deployment bundle
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with:
                  ref: ${{ inputs.source_commit }}
                  path: bundle
            - name: Validate toolkit bundle pin
              run: bash bundle/deployment/verify-toolkit-pin.sh
            - name: Build private incoming packet
              id: packet
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  SOURCE_COMMIT: ${{ inputs.source_commit }}
                  QUALIFICATION_B64: ${{ inputs.qualified_release_manifest_b64 }}
                  QUALIFICATION_SHA256: ${{ inputs.qualified_manifest_sha256 }}
                  API_DIGEST: ${{ inputs.api_digest }}
                  WEB_DIGEST: ${{ inputs.web_digest }}
                  SCRAPER_DIGEST: ${{ inputs.scraper_digest }}
                  MCP_DIGEST: ${{ inputs.mcp_digest }}
                  APP_PROJECT: ${{ vars.PROJECT }}
                  APP_DOMAIN: ${{ vars.DOMAIN }}
                  APP_MYSQL_USER: ${{ secrets.MYSQL_USER }}
                  APP_MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
                  APP_API_SESSION_SECRET: ${{ secrets.API_SESSION_SECRET }}
                  APP_API_COMMAND_TOKEN: ${{ secrets.API_COMMAND_TOKEN }}
                  APP_MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
                  APP_MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                  APP_MYSQL_URI: ${{ secrets.MYSQL_URI }}
                  APP_REDIS_URI: ${{ secrets.REDIS_URI }}
                  APP_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
                  APP_GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
                  APP_GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
                  APP_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
                  APP_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
                  APP_MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET }}
                  APP_PHPMYADMIN_BASIC_AUTH: ${{ secrets.PHPMYADMIN_BASIC_AUTH }}
                  APP_ENVIRONMENT: ${{ inputs.environment }}
                  APP_SOURCE_COMMIT: ${{ inputs.source_commit }}
                  GRAFANA_ADMIN_USER: ${{ secrets.GRAFANA_ADMIN_USER }}
                  GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
                  DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
                  HEALTHCHECKS_PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
                  UMAMI_DB_NAME: ${{ secrets.UMAMI_DB_NAME }}
                  UMAMI_DB_USER: ${{ secrets.UMAMI_DB_USER }}
                  UMAMI_DB_PASSWORD: ${{ secrets.UMAMI_DB_PASSWORD }}
                  UMAMI_APP_SECRET: ${{ secrets.UMAMI_APP_SECRET }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_ACTOR: ${{ github.actor }}
              run: |
                  set -euo pipefail
                  set +x
                  umask 077
                  mkdir -m 700 incoming
                  python3 controller/deployment/package-release.py bundle/deployment "$PWD/incoming"
                  bash controller/deployment/render-env.sh "$TARGET_ENVIRONMENT" "$PWD/incoming/release.env"
                  mkdir -m 700 incoming/registry
                  printf '%s' "$GH_TOKEN" | docker --config "$PWD/incoming/registry" login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
            - name: Reserve isolated incoming directory
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_ENVIRONMENT,INCOMING_ID,EXPECTED_TOOLKIT_VERSION
                  command_timeout: 5m
                  script: |
                      set -euo pipefail
                      umask 077
                      [[ "$INCOMING_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ && "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ ]] || exit 1
                      actual="$(/usr/local/bin/toolkit version | sed -n 's/^toolkit_version=\([^ ]*\).*/\1/p')"
                      [[ -n "$EXPECTED_TOOLKIT_VERSION" && "$actual" == "$EXPECTED_TOOLKIT_VERSION" ]] || { echo 'ERROR: host toolkit differs from deployment/toolkit.lock'; exit 1; }
                      base="$HOME/kreditozrouti/incoming/$TARGET_ENVIRONMENT"
                      mkdir -p -m 700 "$base"
                      mkdir -m 700 "$base/$INCOMING_ID"
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  INCOMING_ID: ${{ github.run_id }}-${{ github.run_attempt }}
                  EXPECTED_TOOLKIT_VERSION: ${{ steps.packet.outputs.toolkit_version }}
              id: reserve
            - name: Upload packet
              uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  source: incoming/
                  target: ~/kreditozrouti/incoming/${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}
                  strip_components: 1
            - name: Deploy snapshot
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_ENVIRONMENT,INCOMING_ID,EXPECTED_TOOLKIT_VERSION
                  command_timeout: 110m
                  script: |
                      set -euo pipefail
                      [[ "$INCOMING_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ && "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ ]] || exit 1
                      incoming="$HOME/kreditozrouti/incoming/$TARGET_ENVIRONMENT/$INCOMING_ID"
                      actual="$(/usr/local/bin/toolkit version | sed -n 's/^toolkit_version=\([^ ]*\).*/\1/p')"
                      [[ "$actual" == "$EXPECTED_TOOLKIT_VERSION" ]] || { echo 'ERROR: host toolkit pin changed'; exit 1; }
                      chmod 600 "$incoming/release.env" "$incoming/registry/config.json"
                      sudo -n /usr/local/bin/toolkit release deploy --repository kreditozrouti --environment "$TARGET_ENVIRONMENT" \
                        --root "$HOME/kreditozrouti/versions/$TARGET_ENVIRONMENT" --archive "$incoming/release.tar.gz" \
                        --checksum "$incoming/release.sha256" --manifest "$incoming/manifest.json" \
                        --env-file "$incoming/release.env" --user "$(id -un)" --registry-config "$incoming/registry"
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  INCOMING_ID: ${{ github.run_id }}-${{ github.run_attempt }}
                  EXPECTED_TOOLKIT_VERSION: ${{ steps.packet.outputs.toolkit_version }}
            - name: Remove own incoming packet
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_ENVIRONMENT,INCOMING_ID
                  command_timeout: 5m
                  script: |
                      set -euo pipefail
                      [[ "$INCOMING_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ && "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ ]] || exit 1
                      incoming="$HOME/kreditozrouti/incoming/$TARGET_ENVIRONMENT/$INCOMING_ID"
                      [[ ! -L "$incoming" ]] || exit 1
                      rm -rf -- "$incoming"
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  INCOMING_ID: ${{ github.run_id }}-${{ github.run_attempt }}
              if: always() && steps.reserve.outcome == 'success'
            - name: Remove runner registry credentials
              if: always()
              run: rm -rf -- "$GITHUB_WORKSPACE/incoming"
