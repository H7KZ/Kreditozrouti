# ==============================================================================
# Workflow: Deploy Service (reusable)
# Description: Deploys a single service to the VPS via deploy.sh. api/scraper/mcp
#              are deployed together with their infrastructure dependencies
#              (mysql/redis); web keeps --no-deps. See deploy.sh for details.
#              Called by deploy-all.yml/rollback.yml for each selected service.
#
# Inputs:  service, environment, project_name, image_tag, image_prefix
# Scopes:  GitHub Environment secrets via `environment: ${{ inputs.environment }}`
# ==============================================================================

name: Deploy Service (reusable)

on:
    workflow_call:
        inputs:
            service:
                description: 'Service to deploy: api | web | scraper'
                required: true
                type: string
            environment:
                description: 'Target environment: production | development'
                required: true
                type: string
            project_name:
                description: 'Docker Compose project name: prod | dev'
                required: true
                type: string
            image_tag:
                description: 'Image tag (short SHA from build step)'
                required: true
                type: string
            image_prefix:
                description: 'Registry path prefix (e.g. ghcr.io/h7kz/kreditozrouti)'
                required: true
                type: string
            operation_action:
                description: 'Operation type recorded by the host toolkit'
                required: false
                default: deploy
                type: string

jobs:
    deploy:
        name: Deploy ${{ inputs.service }} to ${{ inputs.environment }}
        runs-on: ubuntu-latest
        timeout-minutes: 15

        environment: ${{ inputs.environment }}

        permissions:
            contents: read
            packages: read

        steps:
            - name: Require a pinned SSH host fingerprint
              env:
                  SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
              run: |
                  set -euo pipefail
                  [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || {
                    echo "ERROR: SSH_HOST_FINGERPRINT must contain the trusted SHA256 host fingerprint"
                    exit 1
                  }

            - name: Checkout
              uses: actions/checkout@v7

            - name: Validate pinned toolkit bundle
              run: bash deployment/verify-toolkit-pin.sh

            - name: Create Version Directory
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  script: |
                      mkdir -p "$HOME/kreditozrouti/versions/${{ inputs.environment }}/${{ inputs.image_tag }}"

            - name: Upload Deployment Files
              uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  source: 'deployment/'
                  target: '~/kreditozrouti/versions/${{ inputs.environment }}/${{ inputs.image_tag }}'
                  strip_components: 1
                  overwrite: true

            - name: Deploy Service
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
              env:
                  # Auth
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_ACTOR: ${{ github.actor }}
                  # Image
                  IMG_REGISTRY: ghcr.io
                  IMG_PREFIX: ${{ inputs.image_prefix }}
                  IMG_TAG: ${{ inputs.image_tag }}
                  # Service
                  APP_SERVICE: ${{ inputs.service }}
                  APP_ENV: ${{ inputs.environment }}
                  OPERATION_ACTION: ${{ inputs.operation_action || 'deploy' }}
                  TOOLKIT_LOCKS_REQUIRED: ${{ vars.TOOLKIT_LOCKS_REQUIRED || 'false' }}
                  # Non-sensitive (GitHub Variables)
                  APP_PROJECT: ${{ vars.PROJECT }}
                  APP_DOMAIN: ${{ vars.DOMAIN }}
                  APP_MYSQL_USER: ${{ secrets.MYSQL_USER }}
                  APP_MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
                  # Sensitive (GitHub Secrets)
                  APP_API_SESSION_SECRET: ${{ secrets.API_SESSION_SECRET }}
                  APP_API_COMMAND_TOKEN: ${{ secrets.API_COMMAND_TOKEN }}
                  APP_MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
                  APP_MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
                  APP_MYSQL_URI: ${{ secrets.MYSQL_URI }}
                  APP_REDIS_URI: ${{ secrets.REDIS_URI }}
                  APP_REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
                  APP_GOOGLE_USER: ${{ secrets.GOOGLE_USER }}
                  APP_GOOGLE_APP_PASSWORD: ${{ secrets.GOOGLE_APP_PASSWORD }}
                  APP_UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
                  APP_UMAMI_SRC: ${{ vars.UMAMI_SRC }}
                  APP_MCP_JWT_SECRET: ${{ secrets.MCP_JWT_SECRET }}
                  APP_PHPMYADMIN_BASIC_AUTH: ${{ secrets.PHPMYADMIN_BASIC_AUTH }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: GH_TOKEN,GH_ACTOR,IMG_REGISTRY,IMG_PREFIX,IMG_TAG,APP_SERVICE,APP_ENV,OPERATION_ACTION,TOOLKIT_LOCKS_REQUIRED,APP_PROJECT,APP_DOMAIN,APP_MYSQL_USER,APP_MYSQL_DATABASE,APP_API_SESSION_SECRET,APP_API_COMMAND_TOKEN,APP_MYSQL_PASSWORD,APP_MYSQL_ROOT_PASSWORD,APP_MYSQL_URI,APP_REDIS_URI,APP_REDIS_PASSWORD,APP_GOOGLE_USER,APP_GOOGLE_APP_PASSWORD,APP_UMAMI_WEBSITE_ID,APP_UMAMI_SRC,APP_MCP_JWT_SECRET,APP_PHPMYADMIN_BASIC_AUTH
                  script: |
                      set -euo pipefail

                      VERSION_DIR="$HOME/kreditozrouti/versions/${{ inputs.environment }}/$IMG_TAG"
                      CURRENT_LINK="$HOME/kreditozrouti/versions/${{ inputs.environment }}/current"

                      echo "=========================================="
                      echo "Service Deploy: $APP_SERVICE @ $IMG_TAG → ${{ inputs.environment }}"
                      echo "=========================================="

                      # -----------------------------------------------------------------
                      # Secret shape validation. Runs BEFORE the .env is written and
                      # before docker login, so a bad secret fails fast without touching
                      # any server state.
                      #
                      # TWO READERS can eat a dollar sign on the way to the container:
                      #   1. this shell - defeated by the printf-with-quoted-value writer
                      #      below, which never lets the shell expand a secret;
                      #   2. Compose - it interpolates the .env file it is handed, so
                      #      MYSQL_PASSWORD=abc$def reaches the container as abc.
                      # Nothing defeats the second reader, so a value that cannot survive
                      # it is rejected here rather than deployed as a quietly different
                      # value. For MYSQL_ROOT_PASSWORD the damage is unrecoverable: the
                      # database initialises with the truncated value on first boot, and
                      # the real password then differs from the stored secret forever.
                      # -----------------------------------------------------------------
                      reject_uncarryable() {
                        case "$2" in
                          *'$'*|*'`'*)
                            echo "ERROR: secret $1 contains a '\$' or a backtick, which this deploy cannot carry."
                            echo "       The remote .env is interpolated by Compose, so the container would"
                            echo "       receive a TRUNCATED value - silently, with no error anywhere."
                            echo "       Fix: regenerate it with  openssl rand -base64 32"
                            echo "       (base64's alphabet contains neither '\$' nor a backtick, so a"
                            echo "        generated value always passes this check.)"
                            exit 1
                            ;;
                        esac
                      }

                      reject_uncarryable MYSQL_USER "$APP_MYSQL_USER"
                      reject_uncarryable MYSQL_DATABASE "$APP_MYSQL_DATABASE"
                      reject_uncarryable MYSQL_PASSWORD "$APP_MYSQL_PASSWORD"
                      reject_uncarryable MYSQL_ROOT_PASSWORD "$APP_MYSQL_ROOT_PASSWORD"
                      reject_uncarryable MYSQL_URI "$APP_MYSQL_URI"
                      reject_uncarryable REDIS_URI "$APP_REDIS_URI"
                      reject_uncarryable REDIS_PASSWORD "$APP_REDIS_PASSWORD"
                      reject_uncarryable API_SESSION_SECRET "$APP_API_SESSION_SECRET"
                      reject_uncarryable API_COMMAND_TOKEN "$APP_API_COMMAND_TOKEN"
                      reject_uncarryable MCP_JWT_SECRET "${APP_MCP_JWT_SECRET:-}"
                      reject_uncarryable GOOGLE_APP_PASSWORD "${APP_GOOGLE_APP_PASSWORD:-}"
                      reject_uncarryable UMAMI_WEBSITE_ID "${APP_UMAMI_WEBSITE_ID:-}"

                      # PHPMYADMIN_BASIC_AUTH is written single-quoted (it legitimately holds '$'),
                      # so the only thing that breaks it is a quote or a newline.
                      case "${APP_PHPMYADMIN_BASIC_AUTH:-}" in
                        *"'"*|*$'\n'*)
                          echo "ERROR: secret PHPMYADMIN_BASIC_AUTH must be a single line with no single quote."
                          exit 1
                          ;;
                      esac

                      echo "Secret shape validation passed."

                      # Login to GHCR
                      echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
                      trap 'docker logout ghcr.io' EXIT

                      # Write .env - printf with a quoted value keeps the SHELL from
                      # expanding a secret. That is only the first of the two readers
                      # described above; Compose is the second, and the validation block
                      # is what protects against it.
                      {
                        printf 'ENV=%s\n' "$APP_ENV"
                        printf 'PROJECT=%s\n' "$APP_PROJECT"
                        printf 'DOMAIN=%s\n' "$APP_DOMAIN"
                        printf 'API_SESSION_SECRET=%s\n' "$APP_API_SESSION_SECRET"
                        printf 'API_COMMAND_TOKEN=%s\n' "$APP_API_COMMAND_TOKEN"
                        printf 'VITE_APP_VERSION=%s\n' "$IMG_TAG"
                        printf 'MYSQL_USER=%s\n' "$APP_MYSQL_USER"
                        printf 'MYSQL_DATABASE=%s\n' "$APP_MYSQL_DATABASE"
                        printf 'MYSQL_PASSWORD=%s\n' "$APP_MYSQL_PASSWORD"
                        printf 'MYSQL_ROOT_PASSWORD=%s\n' "$APP_MYSQL_ROOT_PASSWORD"
                        printf 'MYSQL_URI=%s\n' "$APP_MYSQL_URI"
                        printf 'REDIS_URI=%s\n' "$APP_REDIS_URI"
                        printf 'REDIS_PASSWORD=%s\n' "$APP_REDIS_PASSWORD"
                        printf 'GOOGLE_USER=%s\n' "$APP_GOOGLE_USER"
                        printf 'GOOGLE_APP_PASSWORD=%s\n' "${APP_GOOGLE_APP_PASSWORD:-}"
                        printf 'VITE_UMAMI_WEBSITE_ID=%s\n' "${APP_UMAMI_WEBSITE_ID:-}"
                        printf 'VITE_UMAMI_SRC=%s\n' "$APP_UMAMI_SRC"
                        printf 'MCP_JWT_SECRET=%s\n' "${APP_MCP_JWT_SECRET:-}"
                        # htpasswd lines contain '$' (bcrypt/apr1). Single quotes make Compose's
                        # .env parser take the value literally, so it is not interpolated.
                        printf "PHPMYADMIN_BASIC_AUTH='%s'\n" "${APP_PHPMYADMIN_BASIC_AUTH:-}"
                      } > "$VERSION_DIR/.env"
                      chmod 600 "$VERSION_DIR/.env"

                      [[ "$TOOLKIT_LOCKS_REQUIRED" == true || "$TOOLKIT_LOCKS_REQUIRED" == false ]] || {
                        echo "ERROR: TOOLKIT_LOCKS_REQUIRED must be true or false."
                        exit 1
                      }
                      [[ "$OPERATION_ACTION" == deploy || "$OPERATION_ACTION" == rollback ]] || {
                        echo "ERROR: unsupported operation action: $OPERATION_ACTION"
                        exit 1
                      }

                      # Pass tag as env var (not via .images - avoids write race when all 3 services deploy simultaneously)
                      # derive the correct SERVICE_IMAGE_TAG var name from $APP_SERVICE
                      case "$APP_SERVICE" in
                        api)     SERVICE_TAG_VAR="API_IMAGE_TAG" ;;
                        web)  SERVICE_TAG_VAR="WEB_IMAGE_TAG" ;;
                        scraper) SERVICE_TAG_VAR="SCRAPER_IMAGE_TAG" ;;
                        mcp)     SERVICE_TAG_VAR="MCP_IMAGE_TAG" ;;
                        *)       echo "Unknown service: '$APP_SERVICE'. Valid: api, web, scraper, mcp"; exit 1 ;;
                      esac

                      TOOLKIT_BIN=/usr/local/bin/toolkit
                      if [[ "$TOOLKIT_LOCKS_REQUIRED" == true || -x "$TOOLKIT_BIN" ]]; then
                        [[ -x "$TOOLKIT_BIN" ]] || {
                          echo "ERROR: host toolkit is required but missing: $TOOLKIT_BIN"
                          exit 1
                        }
                        EXPECTED_TOOLKIT_VERSION="$(awk -F= '$1 == "TOOLKIT_VERSION" { if (seen++) exit 2; print substr($0, index($0, "=") + 1) } END { if (!seen) exit 1 }' "$VERSION_DIR/toolkit.lock")" || {
                          echo "ERROR: deployment toolkit pin is missing or invalid"
                          exit 1
                        }
                        ACTUAL_TOOLKIT_VERSION="$("$TOOLKIT_BIN" version | sed -n 's/^toolkit_version=\([^ ]*\).*/\1/p')"
                        [[ "$ACTUAL_TOOLKIT_VERSION" == "$EXPECTED_TOOLKIT_VERSION" ]] || {
                          echo "ERROR: host toolkit $ACTUAL_TOOLKIT_VERSION does not match pinned version $EXPECTED_TOOLKIT_VERSION"
                          exit 1
                        }
                        command -v sudo >/dev/null 2>&1 || { echo "ERROR: sudo is required for toolkit locks."; exit 1; }
                        command -v runuser >/dev/null 2>&1 || { echo "ERROR: runuser is required for toolkit locks."; exit 1; }
                        DEPLOY_USER="$(id -un)"
                        DEPLOY_HOME="$HOME"
                        declare -a DEPLOY_ENV=("HOME=$DEPLOY_HOME" 'IMAGE_REGISTRY=ghcr.io' "IMAGE_PREFIX=$IMG_PREFIX" "$SERVICE_TAG_VAR=$IMG_TAG")
                        sudo -n "$TOOLKIT_BIN" with-lock \
                          --repository kreditozrouti --environment "$APP_ENV" --action "$OPERATION_ACTION" \
                          --release-id "$IMG_TAG" --timeout 3600 -- \
                          runuser -u "$DEPLOY_USER" -- env "${DEPLOY_ENV[@]}" bash -c '
                            set -euo pipefail
                            cd "$1"
                            bash ./deploy.sh "$2" "$3" "$4"
                            ln -sfn "$1" "$5"
                          ' _ "$VERSION_DIR" "${{ inputs.project_name }}" "$APP_ENV" "$APP_SERVICE" "$CURRENT_LINK"
                      else
                        echo "WARNING: host toolkit is not installed; deployment is unlocked. Keep backup scheduling disabled."
                        cd "$VERSION_DIR"
                        export "${SERVICE_TAG_VAR}=${IMG_TAG}"
                        IMAGE_REGISTRY="ghcr.io" \
                          IMAGE_PREFIX="$IMG_PREFIX" \
                          bash ./deploy.sh "${{ inputs.project_name }}" "$APP_ENV" "$APP_SERVICE"
                        ln -sfn "$VERSION_DIR" "$CURRENT_LINK"
                      fi

                      echo "=========================================="
                      echo "Service deploy complete: $APP_SERVICE"
                      echo "=========================================="
