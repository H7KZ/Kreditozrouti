# ==============================================================================
# Workflow: Cleanup Package Versions (reusable)
# Description: Disabled until cleanup consumes trusted backup and deployment
#              recovery references.
#
# Inputs:
#   package-name         Full GHCR package name, e.g. kreditozrouti/api
#   min-versions-to-keep Number of recent versions to keep (default: 10)
# ==============================================================================

name: Cleanup Package Versions (reusable)

on:
    workflow_call:
        inputs:
            package-name:
                description: 'Full GHCR package name, e.g. kreditozrouti/api'
                required: true
                type: string
            min-versions-to-keep:
                description: 'Number of most-recent versions to keep (floating tags excluded from count)'
                required: false
                type: number
                default: 10

jobs:
    cleanup:
        name: Cleanup ${{ inputs.package-name }} versions
        runs-on: ubuntu-latest
        timeout-minutes: 10

        permissions:
            packages: read

        steps:
            - name: Keep cleanup disabled
              run: |
                  echo "::notice::GHCR deletion remains disabled until trusted recovery references are consumed."
