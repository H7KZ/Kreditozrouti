# ==============================================================================
# Workflow: Verify
# Description: Runs code verification on pull requests. The steps themselves
#              live in _verify.yml so that deploy.yml can gate its build
#              and deploy jobs on exactly the same checks.
# Trigger: Pull request events targeting main (opened, synchronize, reopened)
#
# Required Secrets: none - see _verify.yml
#
# Prerequisites:
#   - Node.js 24
#   - Makefile with install, lint, test, type-check and build targets
# ==============================================================================

name: Verify Code
run-name: Verify Code | ${{ inputs.ref || github.head_ref || github.ref_name }}

on:
    workflow_dispatch:
        inputs:
            ref:
                description: Source branch, tag or SHA (empty = selected workflow ref)
                type: string
                default: ''
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

permissions:
    contents: read

concurrency:
    group: ci-${{ github.head_ref || github.ref }}
    cancel-in-progress: true

jobs:
    verify:
        name: Verify Code
        uses: ./.github/workflows/_verify.yml
        with:
            affected: ${{ github.event_name == 'pull_request' }}
            source_commit: ${{ inputs.ref || github.sha }}
