# ==============================================================================
# Workflow: MCP
# Description: Type-checks, lints, and builds the MCP server on every push
#              touching mcp/ on main or develop.
#
# Trigger: push/PR to main or develop with path filter
# ==============================================================================

name: MCP

on:
  push:
    branches: [ main, develop ]
    paths: [ 'mcp/**' ]
  pull_request:
    paths: [ 'mcp/**' ]

jobs:
  build:
    name: Type-check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcp

      - name: Type check
        run: npx tsc --noEmit
        working-directory: mcp

      - name: Lint
        run: npm run lint
        working-directory: mcp

      - name: Build
        run: npm run build
        working-directory: mcp

      # npm publish is scaffolded here for future use when the package is ready
      # to be released to the npm registry. Uncomment and configure when needed.
