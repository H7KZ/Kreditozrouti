# ==============================================================================
# Workflow: Sync Scripts
# Description: Syncs only scripts/ to the VPS, independent of the main deploy
#              pipeline, so ops scripts can be updated without a full deploy.
#              Target is namespaced under ~/kreditozrouti/ (not a bare ~/scripts)
#              since Infrastructure/Kreditozrouti/Ohlidame all deploy as the same
#              VPS user and would otherwise overwrite each other's scripts.
# Trigger: manual dispatch only
# ==============================================================================

name: Sync Scripts

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: sync-scripts
    cancel-in-progress: false

jobs:
    sync:
        name: Sync Scripts to VPS
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Require a pinned SSH host fingerprint
              env:
                  SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
              run: |
                  set -euo pipefail
                  [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || {
                    echo "ERROR: SSH_HOST_FINGERPRINT must contain the trusted SHA256 host fingerprint"
                    exit 1
                  }

            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Upload Scripts
              uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  source: 'scripts/*'
                  target: '~/kreditozrouti/scripts'
                  strip_components: 1
                  overwrite: true

            - name: Set Permissions
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  script: |
                      set -euo pipefail
                      chmod +x ~/kreditozrouti/scripts/*.sh 2>/dev/null || true
                      echo "Scripts synced: $(ls -1 ~/kreditozrouti/scripts/*.sh 2>/dev/null | wc -l) files"
