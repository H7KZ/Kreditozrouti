name: Rollback Deployment
'on':
    workflow_dispatch:
        inputs:
            release_id:
                description: 'Saved complete snapshot: previous or fullSHA-run-attempt'
                required: true
                type: string
                default: previous
            environment:
                description: Target environment
                required: true
                type: choice
                options:
                    - production
                    - development
                    - monitoring
                default: production
permissions:
    contents: read
    packages: read
concurrency:
    group: ${{ format('deploy-{0}', inputs.environment) }}
    cancel-in-progress: false
jobs:
    rollback:
        runs-on: ubuntu-latest
        timeout-minutes: 120
        environment: ${{ inputs.environment }}
        steps:
            - name: Require main and trusted fingerprint
              env:
                  WORKFLOW_REF: ${{ github.ref }}
                  SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  RELEASE_ID: ${{ inputs.release_id }}
              run: |
                  set -euo pipefail
                  [[ "$WORKFLOW_REF" == refs/heads/main && "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ ]] || exit 1
                  [[ "$RELEASE_ID" == previous || "$RELEASE_ID" =~ ^[a-f0-9]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]] || { echo 'ERROR: choose previous or a full snapshot release ID'; exit 1; }
                  [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || exit 1
            - name: Checkout control pin
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
            - name: Validate toolkit pin
              run: bash deployment/verify-toolkit-pin.sh
            - name: Prepare isolated registry credentials
              id: auth
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_ACTOR: ${{ github.actor }}
              run: |
                  set -euo pipefail
                  set +x
                  umask 077
                  mkdir -m 700 incoming
                  mkdir -m 700 incoming/registry
                  printf '%s' "$GH_TOKEN" | docker --config "$PWD/incoming/registry" login ghcr.io -u "$GH_ACTOR" --password-stdin >/dev/null
                  expected="$(awk -F= '$1 == "TOOLKIT_VERSION" { if (seen++) exit 2; print $2 } END { if (!seen) exit 1 }' deployment/toolkit.lock)"
                  [[ "$(printf '%s\n' 0.8.1 "$expected" | sort -V | head -1)" == 0.8.1 ]] || exit 1
                  echo "toolkit_version=$expected" >> "$GITHUB_OUTPUT"
            - name: Reserve isolated incoming directory
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  INCOMING_ID: ${{ github.run_id }}-${{ github.run_attempt }}
                  EXPECTED_TOOLKIT_VERSION: ${{ steps.auth.outputs.toolkit_version }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_ENVIRONMENT,INCOMING_ID,EXPECTED_TOOLKIT_VERSION
                  command_timeout: 5m
                  script: |
                      set -euo pipefail
                      umask 077
                      [[ "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ && "$INCOMING_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] || exit 1
                      actual="$(/usr/local/bin/toolkit version | awk -F'[= ]' '/^toolkit_version=/ {print $2}')"
                      [[ "$actual" == "$EXPECTED_TOOLKIT_VERSION" ]] || { echo 'ERROR: toolkit pin mismatch'; exit 1; }
                      mkdir -p -m 700 "$HOME/kreditozrouti/incoming/$TARGET_ENVIRONMENT"
                      mkdir -m 700 "$HOME/kreditozrouti/incoming/$TARGET_ENVIRONMENT/$INCOMING_ID"
              id: reserve
            - name: Upload isolated registry config
              uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  source: incoming/
                  target: ~/kreditozrouti/incoming/${{ inputs.environment }}/${{ github.run_id }}-${{ github.run_attempt }}
                  strip_components: 1
            - name: Restore complete saved snapshot
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  INCOMING_ID: ${{ github.run_id }}-${{ github.run_attempt }}
                  EXPECTED_TOOLKIT_VERSION: ${{ steps.auth.outputs.toolkit_version }}
                  RELEASE_ID: ${{ inputs.release_id }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_ENVIRONMENT,INCOMING_ID,EXPECTED_TOOLKIT_VERSION,RELEASE_ID
                  command_timeout: 110m
                  script: |
                      set -euo pipefail
                      [[ "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ && "$INCOMING_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] || exit 1
                      [[ "$RELEASE_ID" == previous || "$RELEASE_ID" =~ ^[a-f0-9]{40}-[1-9][0-9]*-[1-9][0-9]*$ ]] || exit 1
                      actual="$(/usr/local/bin/toolkit version | awk -F'[= ]' '/^toolkit_version=/ {print $2}')"
                      [[ "$actual" == "$EXPECTED_TOOLKIT_VERSION" ]] || exit 1
                      incoming="$HOME/kreditozrouti/incoming/$TARGET_ENVIRONMENT/$INCOMING_ID"
                      chmod 600 "$incoming/registry/config.json"
                      sudo -n /usr/local/bin/toolkit release rollback --repository kreditozrouti --environment "$TARGET_ENVIRONMENT" \
                        --root "$HOME/kreditozrouti/versions/$TARGET_ENVIRONMENT" --user "$(id -un)" --release-id "$RELEASE_ID" --registry-config "$incoming/registry"
            - name: Remove own registry credentials
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
              env:
                  TARGET_ENVIRONMENT: ${{ inputs.environment }}
                  INCOMING_ID: ${{ github.run_id }}-${{ github.run_attempt }}
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  envs: TARGET_ENVIRONMENT,INCOMING_ID
                  command_timeout: 5m
                  script: |
                      set -euo pipefail
                      [[ "$TARGET_ENVIRONMENT" =~ ^(production|development|monitoring)$ && "$INCOMING_ID" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]] || exit 1
                      incoming="$HOME/kreditozrouti/incoming/$TARGET_ENVIRONMENT/$INCOMING_ID"
                      [[ ! -L "$incoming" ]] || exit 1
                      rm -rf -- "$incoming"
              if: always() && steps.reserve.outcome == 'success'
            - name: Remove runner credentials
              if: always()
              run: rm -rf -- "$GITHUB_WORKSPACE/incoming"
