# ==============================================================================
# Workflow: Umami Retention
# Description: Deletes Umami analytics older than 13 months (self-hosted Umami has no
#              retention setting). Runs deployment/monitoring/umami/retention.sql from
#              the currently deployed monitoring version.
# Trigger: daily schedule, or manual dispatch
# ==============================================================================

name: Umami Retention

on:
    schedule:
        - cron: '17 3 * * *'
    workflow_dispatch:

concurrency:
    group: umami-retention
    cancel-in-progress: false

jobs:
    retention:
        name: Delete old analytics
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment: production
        if: vars.TOOLKIT_LOCKS_REQUIRED == 'true'

        permissions:
            contents: read

        steps:
            - name: Require a pinned SSH host fingerprint
              env:
                  SSH_HOST_FINGERPRINT: ${{ secrets.SSH_HOST_FINGERPRINT }}
              run: |
                  set -euo pipefail
                  [[ "$SSH_HOST_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]+={0,2}$ ]] || {
                    echo "ERROR: SSH_HOST_FINGERPRINT must contain the trusted SHA256 host fingerprint"
                    exit 1
                  }

            - name: Run retention SQL
              uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
              with:
                  host: ${{ secrets.SSH_HOST }}
                  username: ${{ secrets.SSH_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  port: ${{ secrets.SSH_PORT }}
                  fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
                  script: |
                      set -euo pipefail
                      VERSION_DIR="$HOME/kreditozrouti/versions/monitoring/current"
                      EXPECTED_TOOLKIT_VERSION="$(awk -F= '$1 == "TOOLKIT_VERSION" { if (seen++) exit 2; print substr($0, index($0, "=") + 1) } END { if (!seen) exit 1 }' "$VERSION_DIR/toolkit.lock")"
                      ACTUAL_TOOLKIT_VERSION="$(sudo -n /usr/local/bin/toolkit version | sed -n 's/^toolkit_version=\([^ ]*\).*/\1/p')"
                      [[ "$ACTUAL_TOOLKIT_VERSION" == "$EXPECTED_TOOLKIT_VERSION" ]] || { echo "ERROR: host toolkit does not match deployed pin"; exit 1; }
                      DEPLOY_USER="$(id -un)"
                      SQL="$VERSION_DIR/monitoring/umami/retention.sql"
                      sudo -n /usr/local/bin/toolkit with-lock --repository kreditozrouti --environment production --action maintenance --timeout 3600 -- runuser -u "$DEPLOY_USER" -- bash -c '
                          set -euo pipefail
                          docker exec -i kreditozrouti-monitoring-umami-db-1 sh -c "psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\"" < "$1"
                        ' _ "$SQL"
