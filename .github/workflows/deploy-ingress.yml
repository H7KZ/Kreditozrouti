# Deploys this repository's own Traefik ingress (deployment/ingress/): standalone mode only.
# NEVER run it on a host where Infrastructure's Traefik already runs (shared mode): both would
# fight for ports 80/443 and the public-network. See docs/runbooks/fresh-server.md.
name: Deploy Ingress
run-name: Deploy Ingress · ingress · ${{ inputs.ref || github.ref_name }} · ${{ inputs.operation }}
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to deploy (empty = the workflow ref)
        required: false
        type: string
        default: ''
      operation:
        description: Deploy now, stage an immutable snapshot without activating it, or roll back to the previous snapshot
        required: true
        type: choice
        options: [deploy, stage, rollback]
        default: deploy
permissions:
  contents: read
  packages: read
concurrency:
  group: deploy-ingress
  cancel-in-progress: false
jobs:
  runner:
    name: Pick runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      labels: ${{ steps.pick.outputs.labels }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_TOKEN }}
          IS_FORK: ${{ github.event.pull_request.head.repo.fork == true }}
        run: |
          # self-hosted if an idle runner is online (and not a fork PR), else GitHub-hosted
          labels='["ubuntu-latest"]'
          if [ -n "$GH_TOKEN" ] && [ "$IS_FORK" != "true" ]; then
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runners?per_page=100"               --jq '[.runners[] | select(.status == "online" and .busy == false and ([.labels[].name] | index("self-hosted")))] | length' 2>/dev/null || echo 0)
            if [ "${n:-0}" -gt 0 ]; then
              labels='["self-hosted","Linux","X64","hetzner"]'
            fi
          fi
          echo "labels=$labels" >> "$GITHUB_OUTPUT"
          echo "Runner: $labels"

  resolve:
    name: Resolve source
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.labels) }}
    timeout-minutes: 5
    outputs:
      source_commit: ${{ steps.source.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Resolve commit
        id: source
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo '::warning::Standalone ingress only. Never deploy it on a host where the Infrastructure repository Traefik runs.'
  deploy:
    name: Deploy ingress snapshot
    needs: resolve
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ingress
      operation: ${{ inputs.operation }}
      source_commit: ${{ needs.resolve.outputs.source_commit }}
    secrets: inherit
