# Dependabot version updates. Read from the default branch (main) only: edits take effect once merged there.
# Rationale and review procedure: docs/runbooks/dependency-updates.md.
#
# Rules shared by every entry:
#   - monthly (1st), 06:00 Europe/Prague
#   - cooldown: a release must be 7 days old (14 for npm majors) before a version-update PR opens;
#     security updates ignore the cooldown
#   - minor and patch updates are grouped per ecosystem (npm: ONE group for prod + dev, since several
#     npm PRs all rewrite pnpm-lock.yaml and conflict once one merges); a major update is never grouped,
#     so it gets its own PR and is reviewed on its own
#   - only the npm and github-actions minor/patch groups are auto-merged after Verify Code passes
#     (.github/workflows/dependabot-auto-merge.yml); every docker and compose PR is merged by hand
#   - managed toolkit files (deployment/toolkit, deployment/vendor/**) are not listed here on
#     purpose: the pin moves only through `npm run repin` in the Toolkit repository

version: 2

updates:
  # target-branch develop: this repository integrates on develop and releases by PR develop -> main.
  # Version-update PRs target develop; Verify Code runs on PRs to main and develop. Security-update PRs
  # always target the default branch (main), whatever target-branch says.
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github_actions
    commit-message:
      prefix: 'ci(deps)'
    groups:
      actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  # pnpm workspace: ecosystem npm with the root pnpm-lock.yaml covers every package under apps/, packages/ and modules/.
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Prague
    cooldown:
      default-days: 7
      semver-major-days: 14
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - javascript
    commit-message:
      prefix: 'build(deps)'
    groups:
      # One group for production and development: a single PR, a single lockfile rewrite. The auto-merge
      # workflow matches this group name in the PR title.
      npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # @types/node follows the Node major in the Dockerfiles and engines; Node LTS moves by hand, together.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript: 7 breaks typescript-eslint (peer <6.1.0) and vue-tsc 3.x (needs typescript/lib/tsc). Hold until both support it.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']

  # Dockerfile base images (one directory per app).
  - package-ecosystem: docker
    directories:
      - '/apps/*'
    target-branch: develop
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: 'build(deps)'
    groups:
      monitoring-stack:
        patterns: ['grafana/*', 'prom/*']
        update-types: ['minor', 'patch']
      images-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
    ignore:
      # Node moves by hand to the next LTS (even) major, together with engines, @types/node and CI.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Third-party images in the compose files. Images whose tag is a ${VAR} (the app images built here) are not
  # resolvable and are skipped. Traefik, CrowdSec, the socket proxy and Umami (migrates its database on
  # start) are never batched: each gets its own reviewed PR. mysql, redis and postgres are ignored
  # entirely (see below). Grafana, Loki, Alloy, Prometheus and Alertmanager move together.
  - package-ecosystem: docker-compose
    directories:
      - '/'
      - '/deployment/development'
      - '/deployment/ingress'
      - '/deployment/monitoring'
      - '/deployment/production'
    target-branch: develop
    schedule:
      interval: monthly
      time: '06:00'
      timezone: Europe/Prague
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
    commit-message:
      prefix: 'chore(deps)'
    groups:
      images-minor-patch:
        patterns: ['*']
        exclude-patterns: ['traefik', 'crowdsecurity/*', 'tecnativa/*', 'ghcr.io/umami-software/*']
        update-types: ['minor', 'patch']
    ignore:
      # Stateful images: ignored for EVERY version, not only majors. Deploys pin them by digest and refuse to
      # replace a running MySQL/Redis container whose resolved image differs (data-image guard), so even a
      # patch tag bump trips the deploy. A change is a reviewed manual edit with a fresh backup; see
      # docs/runbooks/dependency-updates.md and rollback-and-recovery.md.
      - dependency-name: mysql
      - dependency-name: redis
      # postgres backs Umami (deployment/monitoring); a major cannot read the old data directory.
      - dependency-name: postgres
