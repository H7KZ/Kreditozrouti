overrides:
  typescript: "~6.0.3"

packages:
  - "api"
  - "web"
  - "mcp"
  - "scraper"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  vue-demi: true

minimumReleaseAgeExclude:
  - bullmq@5.80.2 || 5.80.9
  - eslint@10.7.0
  - '@unhead/bundler@3.2.1'
  - '@unhead/vue@3.2.1'
  - mysql2@3.23.1
  - unhead@3.2.1
  - '@intlify/core-base@11.4.9'
  - '@intlify/devtools-types@11.4.9'
  - '@intlify/message-compiler@11.4.9'
  - '@intlify/shared@11.4.9'
  - vue-i18n@11.4.9
  - '@turbo/darwin-64@2.10.13'
  - '@turbo/darwin-arm64@2.10.13'
  - '@turbo/linux-64@2.10.13'
  - '@turbo/linux-arm64@2.10.13'
  - '@turbo/windows-64@2.10.13'
  - '@turbo/windows-arm64@2.10.13'
  - turbo@2.10.13

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - protobufjs
  - vue-demi
