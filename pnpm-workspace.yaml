overrides:
  typescript: "~5.8.3"

packages:
  - "api"
  - "client"
  - "docs"
  - "mcp"
  - "scraper"
  - "packages/*"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  vue-demi: true

minimumReleaseAgeExclude:
  - bullmq@5.80.2
  - eslint@10.7.0

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
  - protobufjs
  - vue-demi
